# Documentation-only TEST-NET endpoints and synthetic Termux UID.
# Render a private copy with real addresses/UID and trusted known_hosts entries.
# IdentityFile selects the owner's PUBLIC key held by their SSH/password agent;
# no private key belongs in this repository. Do not grant this identity to Hermes.
Host pixel pixel-remote pixel-vps
    IdentityFile ~/.ssh/pixel-owner.pub
    IdentitiesOnly yes
    ForwardAgent no
    StrictHostKeyChecking yes
    UserKnownHostsFile ~/.ssh/pixel-owner-known_hosts
    ServerAliveInterval 15
    ServerAliveCountMax 3

Host pixel
    HostName 192.0.2.116
    Port 8022
    User u0_a123
    HostKeyAlias pixel-owner

Host pixel-remote
    HostName 127.0.0.1
    Port 19223
    User u0_a123
    HostKeyAlias pixel-owner
    ProxyJump pixel-vps

Host pixel-vps
    HostName 203.0.113.20
    User pixel-owner-jump
