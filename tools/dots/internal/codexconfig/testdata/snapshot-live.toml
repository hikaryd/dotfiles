model_reasoning_effort = 'low'
model = 'fixture-model'
approval_policy = 'never'
service_tier = 'default'
custom_root = true
[shell_environment_policy]
inherit = 'core'
set = { Z_VAR = 'fake-value', A_VAR = 'fake-value-2' }
[mcp_servers."z.first"]
command = '/fixture/home/bin/server'
args = ['--token', '${TOKEN}']
startup_timeout_sec = 15.0
floats = [1e6, 1e-5, 1e-4, 1e16, -0.0, inf, -inf, nan]
records = [{ z = 1, a = 2 }, { a = 3, z = 4 }]
[mcp_servers."z.first".env]
Z_LAST = 'fake-secret'
A_FIRST = 'fake-secret-2'
[mcp_servers.alpha]
command = 'server'
[mcp_servers.alpha.nested]
'quoted.field' = { last = true, first = 'hello' }
[[agents.worker]]
z = 'first'
a = 1
[[agents.worker]]
a = 2
z = 'second'
[model_providers.cf-openai]
name = 'Fixture provider'
base_url = 'https://fixture.invalid/private-key/fake-secret'
requires_openai_auth = true
[tui]
status_line = ['model']
notifications = true
[projects.local]
trust_level = 'trusted'
