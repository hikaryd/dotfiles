# syntax=toml
#
# paneru — sliding/scrollable tiling WM (Niri/PaperWM-style).
#
# Парадигма vs rift:
#   rift  = именованные воркспейсы + жёсткий app-пиннинг (комнаты).
#   paneru = бесконечная ГОРИЗОНТАЛЬНАЯ лента окон + динамические числовые ряды
#            (virtual workspaces) как вторая, ВЕРТИКАЛЬНАЯ ось.
#
# Главная навигация — скролл по ленте (alt+h/l), а не прыжок в комнату.
# Ряды (alt+1..4) — лёгкая группировка поверх ленты, без привязки приложений
# в самом конфиге: paneru это не умеет. Базовый app->ряд авто-пиннинг делает
# компаньон-демон config/paneru/paneru-rules.py (см. его шапку).
#
# Конфиг перезагружается на лету. Сокет команд: /tmp/paneru.socket.

[options]
# rift: focus_follows_mouse=true, mouse_follows_focus=false — повторяю.
focus_follows_mouse = true
mouse_follows_focus = false

# Ширины колонок, по которым циклит `window_resize` (alt - r).
preset_column_widths = [0.33, 0.5, 0.66, 0.75]

# Скорость анимации: 1/10 ширины дисплея в секунду (50 => 5 экранов/сек).
animation_speed = 50

# Центрировать сфокусированную колонку при скролле по ленте (PaperWM-feel).
# Вкус: поставь false, если хочешь, чтобы лента не «прыгала» под фокус.
auto_center = true

# ВАЖНО: false — чтобы воркспейсы вели себя как фиксированные «комнаты» rift.
# При true paneru удаляет хвостовые пустые ряды и нумерация «съезжает».
reap_empty_workspaces = false

# Новые окна добавляются в КОНЕЦ ленты, а не в середину (предсказуемо).
insert_windows_mid_strip = false

# (Свайп окон тачпадом — отдельная секция [swipe.gesture] ниже; в 0.4.x
#  переехало из [options].swipe_gesture_fingers.)

# Свайп окон тачпадом: 3+ пальца включает жест (раньше swipe_gesture_fingers).
[swipe.gesture]
fingers_count = 4

# Подсветка активного окна (рамка). Экспериментально в 0.4.x (использует
# недокументированные API window-server). Цвет — ayu accent.
[decorations.active.border]
enabled = true
color = "#e6b450"
width = 2.0
radius = "auto"

# ─────────────────────────────────────────────────────────────────────────
# Хоткеи. Грамматика модификаторов (наследует мышечную память rift):
#   alt            — ФОКУС / навигация (leader, как Alt в rift)
#   alt + shift    — ПЕРЕМЕСТИТЬ окно   (как comb1 = Alt+Shift в rift)
#   alt + cmd      — края ленты / «через» (first/last, дисплеи)
#   ctrl + alt     — вертикальная ось рядов (virtual workspaces) + сервис
#   alt + <digit>  — прыжок на ряд N      (сохраняет rift Alt+1..4)
# ─────────────────────────────────────────────────────────────────────────
[bindings]

# --- Фокус по ленте (west/east) и внутри стопки (north/south) ---
# h/l листают ленту; k/j ходят по вертикальной стопке в колонке,
# а при отсутствии окна сверху/снизу — переключают дисплей.
window_focus_west  = "alt - h"
window_focus_south = "alt - j"
window_focus_north = "alt - k"
window_focus_east  = "alt - l"

# Вернуться к предыдущему окну (аналог rift Alt+Tab «последний воркспейс»).
window_focus_managed = "alt - tab"

# --- Переместить (swap) окно — rift comb1 + HJKL ---
window_swap_west  = "alt + shift - h"
window_swap_south = "alt + shift - j"
window_swap_north = "alt + shift - k"
window_swap_east  = "alt + shift - l"

# --- Края ленты: фокус/перенос в самое начало/конец ---
# Замена rift-овскому «прыжку на воркспейс»: тут — в край горизонтали.
window_focus_first = "alt + cmd - h"
window_focus_last  = "alt + cmd - l"
window_swap_first  = "alt + cmd + shift - h"
window_swap_last   = "alt + cmd + shift - l"

# --- Воркспейсы: фиксированный набор как в rift (reap=false держит номера) ---
# 5 рядов (ряд «разное»/Alt+2 удалён — не используется). Клавиши rift сохранены:
#   ряд 1 = браузеры + Толк (+Музыка)   →  Alt+1
#   ряд 2 = мессенджеры/почта            →  Alt+3
#   ряд 3 = Outlook + UpNote/документы   →  Alt+W
#   ряд 4 = система                      →  Alt+E
#   ряд 5 = терминал + дев/БД            →  Alt+D

# Переключиться на ряд (rift: Alt + клавиша).
window_virtualnum_1 = "alt - 1"
window_virtualnum_2 = "alt - 3"
window_virtualnum_3 = "alt - w"
window_virtualnum_4 = "alt - e"
window_virtualnum_5 = "alt - d"

# Перенести окно на ряд + перейти (rift: comb1 = Alt+Shift + клавиша).
window_virtualmovenum_1 = "alt + shift - 1"
window_virtualmovenum_2 = "alt + shift - 3"
window_virtualmovenum_3 = "alt + shift - w"
window_virtualmovenum_4 = "alt + shift - e"
window_virtualmovenum_5 = "alt + shift - d"

# Соседний ряд вверх/вниз + перенос окна между рядами (ctrl держим, чтобы
# не конфликтовать с фокусом alt - k/j).
window_virtual_north     = "ctrl + alt - k"
window_virtual_south     = "ctrl + alt - j"
window_virtualmove_north = "ctrl + alt + shift - k"
window_virtualmove_south = "ctrl + alt + shift - j"

# --- Размер ---
# Размер колонки: ] = шире, [ = уже  (Alt+Shift+] / Alt+Shift+[).
# В этой сборке window_resize == grow (дубль), поэтому отдельный alt-r убрал.
window_grow   = "alt + shift - ]"
window_shrink = "alt + shift - ["

# --- Состояние окна ---
window_fullwidth = "alt - f"      # rift Alt+F (full-screen → здесь full-width)
window_manage    = "alt - space"  # rift Alt+Space — tiled <-> floating
window_center    = "alt - c"      # центрировать колонку (идиом ленты)

# --- Стопка (колонка из нескольких окон по вертикали) ---
window_stack    = "alt - s"            # rift Meta+Shift+J toggle_stack
window_unstack  = "alt + shift - s"
window_equalize = "ctrl + alt - e"     # alt-e занят рядом «система»
window_snap     = "alt - g"            # вернуть окно в видимую область

# --- Дисплеи ---
mouse_nextdisplay      = "alt - n"          # перенести курсор на след. дисплей
window_nextdisplay     = "alt + shift - n"  # окно на след. дисплей + перейти
window_nextdisplaysend = "ctrl + alt - n"   # окно на след. дисплей, остаться

# --- Сервис ---
quit = "ctrl + alt - q"

# ─────────────────────────────────────────────────────────────────────────
# Правила окон. `title` (regex) — ОБЯЗАТЕЛЕН. Чтобы зафлоатить всё приложение:
#   title = ".*" + bundle_id = "<id>" + floating = true.
# paneru НЕ умеет назначать окно на ряд здесь — это делает paneru-rules.py.
# ─────────────────────────────────────────────────────────────────────────
[windows]

[windows.pip]
# Picture-in-Picture всегда плавающий.
title = "Picture.*(in)?.*[Pp]icture"
floating = true

# --- Floating-приложения (портировано из rift app_rules) ---
[windows.onepassword]
title = ".*"
bundle_id = "com.1password.1password"
floating = true

[windows.spotify]
title = ".*"
bundle_id = "com.spotify.client"
floating = true

[windows.raycast]
title = ".*"
bundle_id = "com.raycast.macos"
floating = true

[windows.finder]
title = ".*"
bundle_id = "com.apple.finder"
floating = true

[windows.controlcenter]
title = ".*"
bundle_id = "com.apple.controlcenter"
floating = true

[windows.cisco]
title = ".*"
bundle_id = "com.cisco.secureclient.gui"
floating = true

[windows.aldente]
# Не установлен сейчас; bundle_id общеизвестный — правило сработает, когда поставишь.
title = ".*"
bundle_id = "com.apphousekitchen.aldente-pro"
floating = true

[windows.typora_open]
# rift флоатил только диалог «Открыть» у Typora.
title = "Открыть|Open"
bundle_id = "abnerworks.Typora"
floating = true

[windows.safari_settings]
# Окна настроек Safari тайлятся плохо — флоатим (scope по bundle_id).
title = "^(General|(Tab|Password|Website|Extension)s|AutoFill|Se(arch|curity)|Privacy|Advanced|Settings|Настройки)$"
bundle_id = "com.apple.Safari"
floating = true

# TODO (не установлены / bundle_id не подтверждён — заполни и раскомментируй):
#   v2RayTun, V2BOX, Proton Mail, Psst.
# Узнать bundle_id установленного приложения:
#   /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "/Applications/<App>.app/Contents/Info.plist"
