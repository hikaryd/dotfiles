# Stable personal Codex settings managed by ~/dots.
# Runtime/project/plugin state is intentionally preserved only in ~/.codex/config.toml.
model = "gpt-5.6-sol"
model_provider = "openai"
personality = "pragmatic"
suppress_unstable_features_warning = true
service_tier = "default"
model_reasoning_effort = "low"

[shell_environment_policy]
inherit = "core"

[mcp_servers.browser]
command = "npx"
args = ["@railsblueprint/blueprint-mcp@latest"]
startup_timeout_sec = 15.0

[mcp_servers.token-counter]
command = "npx"
args = ["-y", "token-counter-mcp"]
startup_timeout_sec = 15.0

[mcp_servers.zai-mcp-server]
command = "npx"
args = ["-y", "@z_ai/mcp-server"]
startup_timeout_sec = 15.0

[mcp_servers.zai-mcp-server.env]
Z_AI_API_KEY = "${Z_AI_API_KEY}"
Z_AI_MODE = "ZAI"

[mcp_servers.mobile-mcp]
command = "npx"
args = ["-y", "@mobilenext/mobile-mcp@latest"]
startup_timeout_sec = 15.0

[agents]
max_threads = 6
max_depth = 2

[model_providers.cf-openai]
name = "Cloudflare AI Gateway → OpenAI"
base_url = "${CF_OPENAI_BASE_URL}"
requires_openai_auth = true
wire_api = "responses"

[tui]
status_line = ["model-with-reasoning", "git-branch", "context-remaining", "total-input-tokens", "total-output-tokens", "five-hour-limit", "weekly-limit"]
