# Переносимые настройки Codex; история и локальные настройки хранятся отдельно.
model = "gpt-5.6-sol"
model_provider = "openai"
# YOLO: без запросов подтверждения и без sandbox Codex.
approval_policy = "never"
sandbox_mode = "danger-full-access"
personality = "pragmatic"
suppress_unstable_features_warning = true
service_tier = "default"
model_reasoning_effort = "low"

[shell_environment_policy]
inherit = "core"

[mcp_servers.browser]
command = "/opt/homebrew/bin/blueprint-mcp"
startup_timeout_sec = 15.0

[mcp_servers.token-counter]
command = "npx"
args = ["-y", "token-counter-mcp"]
startup_timeout_sec = 15.0

[mcp_servers.zai-mcp-server]
command = "/opt/homebrew/bin/zai-mcp-server"
startup_timeout_sec = 15.0

[mcp_servers.zai-mcp-server.env]
Z_AI_API_KEY = "${Z_AI_API_KEY}"
Z_AI_MODE = "ZAI"

[mcp_servers.mobile-mcp]
command = "npx"
args = ["-y", "@mobilenext/mobile-mcp@latest"]
startup_timeout_sec = 15.0

# Personal endpoint and credentials are rendered from ~/.codex/.mcp-secrets.
[mcp_servers.Kaiten]
url = "${KAITEN_MCP_URL}"
http_headers = { Authorization = "${KAITEN_MCP_AUTHORIZATION}" }

[agents]
max_threads = 6
max_depth = 2

[model_providers.cf-openai]
name = "Cloudflare AI Gateway → OpenAI"
base_url = "${CF_OPENAI_BASE_URL}"
requires_openai_auth = true
wire_api = "responses"

[tui]
status_line = ["model-with-reasoning", "git-branch", "context-remaining", "total-input-tokens", "total-output-tokens", "five-hour-limit", "weekly-limit"]

# JevGrep discovers the authorized repository from the Codex working directory.
[mcp_servers.jevgrep]
command = "/bin/zsh"
args = ["-f", "-c", "export PATH=\"/opt/homebrew/bin:/usr/local/bin:$PATH\"; source \"$HOME/.config/shell/codex-proxy.sh\"; jevgrep mcp"]
