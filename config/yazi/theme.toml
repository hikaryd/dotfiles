#:schema https://yazi-rs.github.io/schemas/theme.json
# Generated from palette/ayu.toml.
# Цвета заданы и здесь: tmux может не ответить на запрос цветовой схемы.
# Оба режима используют выбранный вариант; меняйте его через generator.

[flavor]
dark  = "ayu-dark"
light = "ayu-dark"

#:schema https://yazi-rs.github.io/schemas/theme.json
# Ayu Dark flavor for Yazi — generated from palette/ayu.toml.
# Edit the palette and run `python3 palette/generate.py`, not this file.

[mgr]
cwd = { fg = "#73d0ff" }

find_keyword  = { fg = "#73d0ff", bold = true, italic = true, underline = true }
find_position = { fg = "#d2a6ff", bold = true, italic = true }

symlink_target = { fg = "#858d9c", italic = true }

marker_copied   = { fg = "#aad94c", bg = "#aad94c" }
marker_cut      = { fg = "#f07178", bg = "#f07178" }
marker_marked   = { fg = "#39bae6", bg = "#39bae6" }
marker_selected = { fg = "#73d0ff", bg = "#73d0ff" }
marker_symbol   = "▏"

count_copied   = { fg = "#0d1017", bg = "#aad94c" }
count_cut      = { fg = "#0d1017", bg = "#f07178" }
count_selected = { fg = "#0d1017", bg = "#73d0ff" }

border_symbol = "│"
border_style  = { fg = "#303847" }

syntect_theme = ""

[tabs]
active   = { fg = "#73d0ff", bg = "#0d1017", bold = true }
inactive = { fg = "#858d9c", bg = "#161a24" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#73d0ff", bg = "#0d1017", bold = true }
normal_alt  = { fg = "#73d0ff", bg = "#161a24" }
select_main = { fg = "#39bae6", bg = "#0d1017", bold = true }
select_alt  = { fg = "#39bae6", bg = "#161a24" }
unset_main  = { fg = "#f07178", bg = "#0d1017", bold = true }
unset_alt   = { fg = "#f07178", bg = "#161a24" }

[indicator]
parent  = { fg = "#bfbdb6", bg = "#273747" }
current = { fg = "#bfbdb6", bg = "#273747" }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep   = { fg = "#858d9c" }
perm_type  = { fg = "#aad94c" }
perm_read  = { fg = "#73d0ff" }
perm_write = { fg = "#f07178" }
perm_exec  = { fg = "#95e6cb" }
progress_label  = { fg = "#bfbdb6", bold = true }
progress_normal = { fg = "#73d0ff", bg = "#161a24" }
progress_error  = { fg = "#0d1017", bg = "#f07178" }

[which]
cols            = 3
mask            = { bg = "#141821" }
cand            = { fg = "#95e6cb" }
rest            = { fg = "#858d9c" }
desc            = { fg = "#bfbdb6" }
separator       = "  "
separator_style = { fg = "#858d9c" }

[confirm]
border  = { fg = "#73d0ff" }
title   = { fg = "#73d0ff", bold = true }
body    = { fg = "#bfbdb6" }
list    = { fg = "#39bae6" }
btn_yes = { fg = "#73d0ff", bg = "#0d1017", bold = true }
btn_no  = { fg = "#bfbdb6", bg = "#161a24" }
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#73d0ff" }
title    = { fg = "#73d0ff", bold = true }
tbl_col  = { fg = "#39bae6" }
tbl_cell = { fg = "#73d0ff", bg = "#273747" }

[notify]
title_info  = { fg = "#aad94c" }
title_warn  = { fg = "#e6b450" }
title_error = { fg = "#f07178" }
icon_info  = ""
icon_warn  = ""
icon_error = ""

[pick]
border   = { fg = "#73d0ff" }
active   = { fg = "#73d0ff", bold = true }
inactive = { fg = "#bfbdb6" }

[input]
border   = { fg = "#73d0ff" }
title    = { fg = "#bfbdb6" }
value    = { fg = "#bfbdb6" }
selected = { fg = "#bfbdb6", bg = "#273747" }

[cmp]
border   = { fg = "#73d0ff" }
active   = { fg = "#bfbdb6", bg = "#273747" }
inactive = { fg = "#bfbdb6" }
icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#73d0ff" }
title   = { fg = "#73d0ff", bold = true }
hovered = { fg = "#39bae6", underline = true }

[help]
on      = { fg = "#95e6cb" }
run     = { fg = "#ff8f40" }
desc    = { fg = "#bfbdb6" }
hovered = { fg = "#bfbdb6", bg = "#273747", bold = true }
footer  = { fg = "#73d0ff", bg = "#0d1017" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#73d0ff" },
	{ mime = "{audio,video}/*", fg = "#d2a6ff" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f07178" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#39bae6" },
	{ mime = "vfs/{absent,stale}", fg = "#858d9c" },
	{ url = "*", is = "orphan", bg = "#f07178" },
	{ url = "*", is = "exec", fg = "#aad94c" },
	{ url = "*", is = "dummy", bg = "#f07178" },
	{ url = "*/", is = "dummy", bg = "#f07178" },
	{ url = "*/", fg = "#59c2ff" }
]

[git]
modified  = { fg = "#73b8ff" }
added     = { fg = "#70bf56" }
untracked = { fg = "#858d9c" }
ignored   = { fg = "#858d9c" }
deleted   = { fg = "#f26d78" }
updated   = { fg = "#73d0ff" }
unknown   = { fg = "#858d9c" }
clean     = { fg = "#aad94c" }
modified_sign  = "•"
added_sign     = "✚"
untracked_sign = "?"
ignored_sign   = ""
deleted_sign   = "✗"
updated_sign   = "↑"
unknown_sign   = ""
clean_sign     = ""
