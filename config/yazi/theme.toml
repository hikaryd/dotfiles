#:schema https://yazi-rs.github.io/schemas/theme.json
# Generated from palette/ayu.toml.
# Цвета заданы и здесь: tmux может не ответить на запрос цветовой схемы.
# Оба режима используют выбранный вариант; меняйте его через generator.

[flavor]
dark  = "ayu-dark"
light = "ayu-dark"

#:schema https://yazi-rs.github.io/schemas/theme.json
# Ayu Dark flavor for Yazi — generated from palette/ayu.toml.
# Edit the palette and run `dots-tools palette`, not this file.

[mgr]
cwd = { fg = "#ffc799" }

find_keyword  = { fg = "#ffc799", bold = true, italic = true, underline = true }
find_position = { fg = "#ffc799", bold = true, italic = true }

symlink_target = { fg = "#a0a0a0", italic = true }

marker_copied   = { fg = "#99ffe4", bg = "#99ffe4" }
marker_cut      = { fg = "#ff8080", bg = "#ff8080" }
marker_marked   = { fg = "#ffc799", bg = "#ffc799" }
marker_selected = { fg = "#ffc799", bg = "#ffc799" }
marker_symbol   = "▏"

count_copied   = { fg = "#101010", bg = "#99ffe4" }
count_cut      = { fg = "#101010", bg = "#ff8080" }
count_selected = { fg = "#101010", bg = "#ffc799" }

border_symbol = "│"
border_style  = { fg = "#282828" }

syntect_theme = ""

[tabs]
active   = { fg = "#ffc799", bg = "#101010", bold = true }
inactive = { fg = "#a0a0a0", bg = "#1c1c1c" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#ffc799", bg = "#101010", bold = true }
normal_alt  = { fg = "#ffc799", bg = "#1c1c1c" }
select_main = { fg = "#ffc799", bg = "#101010", bold = true }
select_alt  = { fg = "#ffc799", bg = "#1c1c1c" }
unset_main  = { fg = "#ff8080", bg = "#101010", bold = true }
unset_alt   = { fg = "#ff8080", bg = "#1c1c1c" }

[indicator]
parent  = { fg = "#ffffff", bg = "#232323" }
current = { fg = "#ffffff", bg = "#232323" }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep   = { fg = "#a0a0a0" }
perm_type  = { fg = "#99ffe4" }
perm_read  = { fg = "#ffc799" }
perm_write = { fg = "#ff8080" }
perm_exec  = { fg = "#50b5aa" }
progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#ffc799", bg = "#1c1c1c" }
progress_error  = { fg = "#101010", bg = "#ff8080" }

[which]
cols            = 3
mask            = { bg = "#181818" }
cand            = { fg = "#50b5aa" }
rest            = { fg = "#a0a0a0" }
desc            = { fg = "#ffffff" }
separator       = "  "
separator_style = { fg = "#a0a0a0" }

[confirm]
border  = { fg = "#ffc799" }
title   = { fg = "#ffc799", bold = true }
body    = { fg = "#ffffff" }
list    = { fg = "#ffc799" }
btn_yes = { fg = "#ffc799", bg = "#101010", bold = true }
btn_no  = { fg = "#ffffff", bg = "#1c1c1c" }
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#ffc799" }
title    = { fg = "#ffc799", bold = true }
tbl_col  = { fg = "#ffc799" }
tbl_cell = { fg = "#ffc799", bg = "#232323" }

[notify]
title_info  = { fg = "#99ffe4" }
title_warn  = { fg = "#ffc799" }
title_error = { fg = "#ff8080" }
icon_info  = ""
icon_warn  = ""
icon_error = ""

[pick]
border   = { fg = "#ffc799" }
active   = { fg = "#ffc799", bold = true }
inactive = { fg = "#ffffff" }

[input]
border   = { fg = "#ffc799" }
title    = { fg = "#ffffff" }
value    = { fg = "#ffffff" }
selected = { fg = "#ffffff", bg = "#232323" }

[cmp]
border   = { fg = "#ffc799" }
active   = { fg = "#ffffff", bg = "#232323" }
inactive = { fg = "#ffffff" }
icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#ffc799" }
title   = { fg = "#ffc799", bold = true }
hovered = { fg = "#ffc799", underline = true }

[help]
on      = { fg = "#50b5aa" }
run     = { fg = "#b0b0b0" }
desc    = { fg = "#ffffff" }
hovered = { fg = "#ffffff", bg = "#232323", bold = true }
footer  = { fg = "#ffc799", bg = "#101010" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#ffc799" },
	{ mime = "{audio,video}/*", fg = "#ffc799" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff8080" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#ffc799" },
	{ mime = "vfs/{absent,stale}", fg = "#a0a0a0" },
	{ url = "*", is = "orphan", bg = "#ff8080" },
	{ url = "*", is = "exec", fg = "#99ffe4" },
	{ url = "*", is = "dummy", bg = "#ff8080" },
	{ url = "*/", is = "dummy", bg = "#ff8080" },
	{ url = "*/", fg = "#ffc799" }
]

[git]
modified  = { fg = "#ffc799" }
added     = { fg = "#99ffe4" }
untracked = { fg = "#a0a0a0" }
ignored   = { fg = "#a0a0a0" }
deleted   = { fg = "#ff8080" }
updated   = { fg = "#ffc799" }
unknown   = { fg = "#a0a0a0" }
clean     = { fg = "#99ffe4" }
modified_sign  = "•"
added_sign     = "✚"
untracked_sign = "?"
ignored_sign   = ""
deleted_sign   = "✗"
updated_sign   = "↑"
unknown_sign   = ""
clean_sign     = ""
