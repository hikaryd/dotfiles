# Yazi — behaviour config (v26+). Colors live in theme.toml + flavors/.

[mgr]
ratio          = [1, 3, 4]
linemode       = "size"
show_hidden    = true
show_symlink   = true
sort_by        = "natural"
sort_dir_first = true
sort_reverse   = false
sort_sensitive = false

[preview]
tab_size      = 2
max_width     = 1000
max_height    = 1500
image_delay   = 30
image_filter  = "lanczos3"
image_quality = 90

[plugin]
prepend_previewers = [
	# Directory tree via eza
	{ mime = "inode/directory", run = "eza-preview" },
	# Media metadata (audio/video only — images keep their thumbnail)
	{ mime = "audio/*", run = "mediainfo" },
	{ mime = "video/*", run = "mediainfo" },
	# Archive contents listing
	{ mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch --show-file-icons" },
	# Rendered Markdown
	{ url = "*.md", run = "glow" },
]
prepend_preloaders = [
	{ mime = "audio/*", run = "mediainfo" },
	{ mime = "video/*", run = "mediainfo" },
]
