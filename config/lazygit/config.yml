gui:
  theme:
    activeBorderColor:
      - "#e6b450"
      - bold
    inactiveBorderColor:
      - "#555e73"
    optionsTextColor:
      - "#39bae6"
    selectedLineBgColor:
      - "#1b1f29"
    selectedRangeBgColor:
      - "#1b1f29"
    cherryPickedCommitBgColor:
      - "#e6b450"
    cherryPickedCommitFgColor:
      - "#0d1017"
    unstagedChangesColor:
      - "#f07178"
    defaultFgColor:
      - "#bfbdb6"
    searchingActiveBorderColor:
      - "#e6b450"
customCommands:
  - key: "C"
    command: "~/dots/scripts/ai_commit"
    description: "Коммит с AI-сообщением + nvim"
    output: "terminal"
    loadingText: "Генерирую AI-сообщение..."
    context: "files"
  - key: "M"
    command: "AI_HELPER_SKIP_COMMIT=1 git commit --no-verify"
    description: "Коммит БЕЗ AI (без hook-ов)"
    output: "terminal"
    loadingText: "Открывается nvim..."
    context: "files"
