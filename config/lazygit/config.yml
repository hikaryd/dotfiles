gui:
  border: rounded
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#ffc799"
      - bold
    inactiveBorderColor:
      - "#5c5c5c"
    searchingActiveBorderColor:
      - "#c8a8e0"
      - bold
    optionsTextColor:
      - "#8fb4e0"
    selectedLineBgColor:
      - "#2a2a2a"
    inactiveViewSelectedLineBgColor:
      - "#232323"
    cherryPickedCommitBgColor:
      - "#2a2a2a"
    cherryPickedCommitFgColor:
      - "#99ffe4"
    markedBaseCommitBgColor:
      - "#2a2a2a"
    markedBaseCommitFgColor:
      - "#8fb4e0"
    unstagedChangesColor:
      - "#ff8080"
    defaultFgColor:
      - "#ececec"
git:
  # Keep remote updates explicit instead of fetching on every startup.
  autoFetch: false
  # delta из gitconfig; --paging=never обязателен: иначе delta запускает less в фоновом PTY
  # lazygit и процессы копятся. Вторая запись (| в lazygit) — обычный git diff.
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never
    - type: rawGit
      name: git
refresher:
  # Preserve automatic refresh with fewer background Git/filesystem probes.
  refreshInterval: 30
  externalChangeCheckInterval: 5
customCommands:
  - key: "C"
    command: "~/dots/scripts/ai_commit"
    description: "Коммит с AI-сообщением + nvim"
    output: "terminal"
    loadingText: "Генерирую AI-сообщение..."
    context: "files"
  - key: "M"
    command: "AI_HELPER_SKIP_COMMIT=1 git commit --no-verify"
    description: "Коммит БЕЗ AI (без hook-ов)"
    output: "terminal"
    loadingText: "Открывается nvim..."
    context: "files"
