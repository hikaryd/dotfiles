gui:
  theme:
    activeBorderColor:
      - "#ffc799"
      - bold
    inactiveBorderColor:
      - "#282828"
    optionsTextColor:
      - "#ffc799"
    selectedLineBgColor:
      - "#232323"
    selectedRangeBgColor:
      - "#232323"
    cherryPickedCommitBgColor:
      - "#232323"
    cherryPickedCommitFgColor:
      - "#ffc799"
    unstagedChangesColor:
      - "#ff8080"
    defaultFgColor:
      - "#ffffff"
    searchingActiveBorderColor:
      - "#ffc799"
git:
  # Keep remote updates explicit instead of fetching on every startup.
  autoFetch: false
refresher:
  # Preserve automatic refresh with fewer background Git/filesystem probes.
  refreshInterval: 30
  externalChangeCheckInterval: 5
customCommands:
  - key: "C"
    command: "~/dots/scripts/ai_commit"
    description: "Коммит с AI-сообщением + nvim"
    output: "terminal"
    loadingText: "Генерирую AI-сообщение..."
    context: "files"
  - key: "M"
    command: "AI_HELPER_SKIP_COMMIT=1 git commit --no-verify"
    description: "Коммит БЕЗ AI (без hook-ов)"
    output: "terminal"
    loadingText: "Открывается nvim..."
    context: "files"
