set -g default-terminal "tmux-256color"

set -g terminal-overrides 'linux*:AX@,*256col*:RGB,*:Smulx=\E[4::%p1%dm,*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g set-clipboard on
set -g terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:extkeys,screen*:title,rxvt*:ignorefkeys,alacritty:clipboard'

set -g xterm-keys on
set -g extended-keys on

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g detach-on-destroy off
set -g focus-events on
set -g renumber-windows on
set -g status-position top
# A very large history magnifies tmux's copy-mode grid allocations. 200k lines
# is still generous while avoiding the pathological 1M-line buffers that made
# the macOS invalid-free bug much easier to trigger.
set -g history-limit 200000
set -g mouse on
setw -g mode-keys vi

# tmux <= 3.7b could abort while rapid wheel events repeatedly initialized
# copy-mode (tmux/tmux#5302). Homebrew 3.7c uses jemalloc, but keep the safer
# explicit transition for old long-lived servers until they are restarted.
bind-key -T root WheelUpPane if-shell -F '#{pane_in_mode}' {
  send-keys -X -N 3 scroll-up
} {
  if-shell -F '#{m/r:(^|/)(ba|z|fi)?sh$,#{pane_current_command}}' {
    copy-mode ; send-keys -X -N 3 scroll-up
  } {
    send-keys -M
  }
}
bind-key -T root WheelDownPane if-shell -F '#{pane_in_mode}' {
  send-keys -X -N 3 scroll-down
} {
  send-keys -M
}

set -g default-shell "/opt/homebrew/bin/zsh"
set -g default-command '/opt/homebrew/bin/zsh'
set-environment -g SHELL "/opt/homebrew/bin/zsh"


bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded!"

unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind _ split-window -v -c "#{pane_current_path}"
unbind c
bind c new-window -c "#{pane_current_path}"

bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

bind h resize-pane -L 5
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5

bind-key -n -r C-H resize-pane -L 5
bind-key -n -r C-J resize-pane -D 5
bind-key -n -r C-K resize-pane -U 5
bind-key -n -r C-L resize-pane -R 5

bind -r m resize-pane -Z
bind f resize-pane -Z

bind v copy-mode -e \; send -X begin-selection
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi м send -X begin-selection
bind-key -T copy-mode-vi М send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi н send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Н send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

bind-key -n C-S-Left  run-shell "tmux swap-window -d -t -1"
bind-key -n C-S-Right run-shell "tmux swap-window -d -t +1"

bind w kill-window
bind-key -n C-w kill-pane

bind-key Space last-window
bind b previous-window

unbind (
unbind )
unbind L
bind-key [ switch-client -p
bind-key ] switch-client -n
bind-key Enter switch-client -l

bind-key -n C-1 select-window -t 1
bind-key -n C-2 select-window -t 2
bind-key -n C-3 select-window -t 3
bind-key -n C-4 select-window -t 4
bind-key -n C-5 select-window -t 5
bind-key -n C-6 select-window -t 6
bind-key -n C-7 select-window -t 7
bind-key -n C-8 select-window -t 8
bind-key -n C-9 select-window -t 9

set -g window-style 'bg=default'
set -g window-active-style 'bg=default'
set -g pane-border-style 'fg=#1b1f29'
set -g pane-active-border-style 'fg=#73d0ff'
set -g pane-border-lines single
set -g pane-border-indicators both
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[fg=#73d0ff],#[fg=#565b66]} #{pane_index}:#{pane_current_command} #[fg=#475266]· #[fg=#565b66]#{b:pane_current_path} '

# Native Ayu statusline. Keep it shell-free: tmux-continuum remains the only
# periodic status command, while all visual segments use cheap tmux formats.
set -g status on
set -g status-position top
set -g status-interval 10
set -g status-justify left
set -g status-style 'bg=default,fg=#565b66'
set -g status-left-length 40
set -g status-right-length 96
set -g status-left '#[fg=#73d0ff,bg=default]#[fg=#0d1017,bg=#73d0ff,bold]  #{=/28/...:session_name} #[fg=#73d0ff,bg=default] '
set -g status-right '#{?client_prefix,#[fg=#95e6cb] C-a #[fg=#475266]│ ,}#{?pane_in_mode,#[fg=#73d0ff] COPY #[fg=#475266]│ ,}#{?window_zoomed_flag,#[fg=#e6b450] ZOOM #[fg=#475266]│ ,}#[fg=#1b1f29,bg=default]#[fg=#bfbdb6,bg=#1b1f29] #{b:pane_current_path} #[fg=#475266]│ #[fg=#c2d94c]#{pane_current_command} #[fg=#1b1f29,bg=default] #[fg=#e6b450]#[fg=#0d1017,bg=#e6b450,bold] %H:%M #[fg=#e6b450,bg=default]'

set -g window-status-separator ' '
set -g window-status-style 'bg=default,fg=#565b66'
set -g window-status-format '#[fg=#1b1f29,bg=default]#[fg=#565b66,bg=#1b1f29] #I #[fg=#bfbdb6]#{=/16/...:window_name}#{?window_activity_flag, #[fg=#73d0ff],}#{?window_bell_flag, #[fg=#f07178],} #[fg=#1b1f29,bg=default]'
set -g window-status-current-format '#[fg=#e6b450,bg=default]#[fg=#0d1017,bg=#e6b450,bold] #I #{=/16/...:window_name}#{?window_zoomed_flag, 󰂓,} #[fg=#e6b450,bg=default]'
set -g window-status-bell-style 'bg=#f07178,fg=#0d1017,bold'
set -g window-status-activity-style 'bg=default,fg=#73d0ff'
set -g window-status-last-style 'bg=default,fg=#95e6cb'

set -g mode-style 'bg=#273747,fg=#73d0ff,bold'
set -g copy-mode-match-style 'bg=#273747,fg=#73d0ff'
set -g copy-mode-current-match-style 'bg=#e6b450,fg=#0d1017,bold'
set -g copy-mode-mark-style 'bg=#95e6cb,fg=#0d1017,bold'
set -g copy-mode-position-style 'bg=#1b1f29,fg=#73d0ff,bold'
set -g copy-mode-position-format ' COPY · %position · %scroll_percentage '
set -g message-style 'bg=#e6b450,fg=#0d1017,bold'
set -g message-command-style 'bg=#73d0ff,fg=#0d1017,bold'
set -g popup-style 'bg=#0d1017,fg=#bfbdb6'
set -g popup-border-style 'fg=#73d0ff'
set -g popup-border-lines rounded
set -g menu-style 'bg=#0d1017,fg=#bfbdb6'
set -g menu-selected-style 'bg=#273747,fg=#e6b450,bold'
set -g menu-border-lines rounded
set -g clock-mode-colour '#e6b450'
set -g display-panes-colour '#475266'
set -g display-panes-active-colour '#e6b450'
set -g display-panes-time 1500

bind g popup -EE -w 90% -h 90% -T ' lazygit ' -d "#{pane_current_path}" lazygit --use-config-file ~/.config/lazygit/config.yml

bind-key T display-popup -E -w 42% -h 50% -T ' sessions ' '~/dots/config/tmux/scripts/sesh-picker.sh'

bind -N "last-session (via sesh)" L run-shell "sesh last"

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-sensible'

# Resurrect/Continuum
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
# Layout, directories and supported processes are durable; rendered pane text
# is not. Capturing it breaks on valid session names containing '/' and can
# make restored shells exit through tmux-resurrect's command wrapper.
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim  'session'
set -g @resurrect-save 'S'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# set -g window-active-style 'bg=colour0'

run -b '~/.tmux/plugins/tpm/tpm'
