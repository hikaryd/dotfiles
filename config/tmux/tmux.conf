set -g default-terminal "tmux-256color"

set -g terminal-overrides 'linux*:AX@,*256col*:RGB,*:Smulx=\E[4::%p1%dm,*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g set-clipboard on
set -g terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:extkeys,screen*:title,rxvt*:ignorefkeys,alacritty:clipboard'

set -g xterm-keys on
set -g extended-keys on

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g detach-on-destroy off
set -g focus-events on
set -g renumber-windows on
set -g status-position top
# A very large history magnifies tmux's copy-mode grid allocations. 200k lines
# is still generous while avoiding the pathological 1M-line buffers that made
# the macOS invalid-free bug much easier to trigger.
set -g history-limit 200000
set -g mouse on
setw -g mode-keys vi

# tmux <= 3.7b could abort while rapid wheel events repeatedly initialized
# copy-mode (tmux/tmux#5302). Homebrew 3.7c uses jemalloc, but keep the safer
# explicit transition for old long-lived servers until they are restarted.
bind-key -T root WheelUpPane if-shell -F '#{pane_in_mode}' {
  send-keys -X -N 3 scroll-up
} {
  if-shell -F '#{m/r:(^|/)(ba|z|fi)?sh$,#{pane_current_command}}' {
    copy-mode ; send-keys -X -N 3 scroll-up
  } {
    send-keys -M
  }
}
bind-key -T root WheelDownPane if-shell -F '#{pane_in_mode}' {
  send-keys -X -N 3 scroll-down
} {
  send-keys -M
}

set -g default-shell "/opt/homebrew/bin/zsh"
set -g default-command '/opt/homebrew/bin/zsh'
set-environment -g SHELL "/opt/homebrew/bin/zsh"


bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded!"

unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind _ split-window -v -c "#{pane_current_path}"
unbind c
bind c new-window -c "#{pane_current_path}"

bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

bind h resize-pane -L 5
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5

bind-key -n -r C-H resize-pane -L 5
bind-key -n -r C-J resize-pane -D 5
bind-key -n -r C-K resize-pane -U 5
bind-key -n -r C-L resize-pane -R 5

bind -r m resize-pane -Z
bind f resize-pane -Z

bind v copy-mode -e \; send -X begin-selection
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi м send -X begin-selection
bind-key -T copy-mode-vi М send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi н send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Н send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

bind-key -n C-S-Left  run-shell "tmux swap-window -d -t -1"
bind-key -n C-S-Right run-shell "tmux swap-window -d -t +1"

bind w kill-window
bind-key -n C-w kill-pane

bind-key Space last-window
bind b previous-window

unbind (
unbind )
unbind L
bind-key [ switch-client -p
bind-key ] switch-client -n
bind-key Enter switch-client -l

bind-key -n C-1 select-window -t 1
bind-key -n C-2 select-window -t 2
bind-key -n C-3 select-window -t 3
bind-key -n C-4 select-window -t 4
bind-key -n C-5 select-window -t 5
bind-key -n C-6 select-window -t 6
bind-key -n C-7 select-window -t 7
bind-key -n C-8 select-window -t 8
bind-key -n C-9 select-window -t 9

# Quiet Ayu: фокус обозначается границей, не яркими плашками.
# Единый фон Ghostty без непрозрачной дымки на неактивной панели.
set -g window-style 'bg=terminal'
# terminal явно сохраняет настоящий фон Ghostty в обоих состояниях.
set -g window-active-style 'bg=terminal'
# Сброс DECSCUSR в tmux иначе превращает Ghostty bar в block.
set -g cursor-style bar
set -g pane-border-style 'fg=#303847'
set -g pane-active-border-style 'fg=#73d0ff'
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-status off
set -g pane-border-format ' #{pane_index}:#{pane_current_command} '

# Только штатные tmux-форматы; периодические команды остаются у Continuum.
set -g status on
set -g status-position top
# The only time field changes once per minute. A slower tick also avoids running
# Continuum's injected status command six times more often than useful.
set -g status-interval 60
set -g status-justify left
set -g status-style 'bg=default,fg=#858d9c'
set -g status-left-length 28
set -g status-right-length 36
set -g status-left '#[fg=#151a23,bg=default]#[fg=#95e6cb,bg=#151a23]  #[fg=#bfbdb6]#{=/18/...:session_name} #[fg=#151a23,bg=default]  '
set -g status-right '#{?client_prefix,#[fg=#e6b450] PREFIX ,}#{?pane_in_mode,#[fg=#73d0ff] COPY ,}#{?window_zoomed_flag,#[fg=#73d0ff] ZOOM ,}#[fg=#858d9c] %H:%M '

set -g window-status-separator ' '
set -g window-status-style 'bg=default,fg=#858d9c'
set -g window-status-format ' #I #{=/16/...:window_name}#{?window_activity_flag, ·,}#{?window_bell_flag, !,} '
set -g window-status-current-format '#[fg=#273747,bg=default]#[fg=#73d0ff,bg=#273747,bold] #I #[fg=#bfbdb6]#{=/16/...:window_name} #[fg=#273747,bg=default]'
set -g window-status-bell-style 'bg=default,fg=#f07178'
set -g window-status-activity-style 'bg=default,fg=#73d0ff'
set -g window-status-last-style 'bg=default,fg=#858d9c'

set -g mode-style 'bg=#273747,fg=#bfbdb6'
set -g copy-mode-match-style 'bg=#273747,fg=#73d0ff'
set -g copy-mode-current-match-style 'bg=#e6b450,fg=#0d1017,bold'
set -g copy-mode-mark-style 'bg=#95e6cb,fg=#0d1017,bold'
set -g copy-mode-position-style 'bg=#273747,fg=#73d0ff'
set -g copy-mode-position-format ' COPY · %position · %scroll_percentage '
set -g message-style 'bg=#273747,fg=#bfbdb6'
set -g message-command-style 'bg=#273747,fg=#73d0ff'
set -g popup-style 'bg=#0d1017,fg=#bfbdb6'
set -g popup-border-style 'fg=#73d0ff'
set -g popup-border-lines rounded
set -g menu-style 'bg=#0d1017,fg=#bfbdb6'
set -g menu-selected-style 'bg=#273747,fg=#73d0ff,bold'
set -g menu-border-lines rounded
set -g clock-mode-colour '#73d0ff'
set -g display-panes-colour '#858d9c'
set -g display-panes-active-colour '#73d0ff'
set -g display-panes-time 1500

# Обход ошибки верхнего ряда popup в renderer tmux 3.7–3.7c.
bind g run-shell '~/dots/config/tmux/scripts/popup.sh #{q:client_tty} #{q:session_id} -EE -w 90% -h 90% -T " lazygit " -d #{q:pane_current_path} "lazygit --use-config-file ~/.config/lazygit/config.yml"'
# Persistent Spotatui: close/detach the popup without stopping the player.
bind-key M run-shell '~/dots/config/tmux/scripts/spotatui-popup.sh #{q:client_tty} #{q:session_id}'

bind-key T run-shell '~/dots/config/tmux/scripts/popup.sh #{q:client_tty} #{q:session_id} -E -w 42% -h 50% -T " sessions " "~/dots/config/tmux/scripts/sesh-picker.sh"'

# Не заменяем прежний sesh picker; проекты различаются по реальному cwd/worktree.
bind-key P run-shell '~/dots/config/tmux/scripts/popup.sh #{q:client_tty} #{q:session_id} -E -w 75% -h 70% -T " projects " -d #{q:pane_current_path} "~/.local/bin/dots projects open"'
bind-key O run-shell '~/dots/config/tmux/scripts/popup.sh #{q:client_tty} #{q:session_id} -EE -w 85% -h 80% -T " dots " -d #{q:pane_current_path} "DOTS_SOURCE_PANE=#{pane_id} ~/.local/bin/dots menu"'
bind-key F run-shell '~/dots/config/tmux/scripts/popup.sh #{q:client_tty} #{q:session_id} -E -w 85% -h 75% -T " references " -d #{q:pane_current_path} "~/.local/bin/dots refs --pane #{pane_id}"'
bind-key Y run-shell '~/dots/config/tmux/scripts/popup.sh #{q:client_tty} #{q:session_id} -EE -w 80% -h 75% -T " clipboard " "~/.local/bin/dots clip"'
bind-key V run-shell '~/dots/config/tmux/scripts/popup.sh #{q:client_tty} #{q:session_id} -E -w 95% -h 90% -T " project status " "~/.local/bin/dots status --interactive"'

bind -N "last-session (via sesh)" L run-shell "sesh last"

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-sensible'

# Resurrect/Continuum
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
# Layout, directories and supported processes are durable; rendered pane text
# is not. Capturing it breaks on valid session names containing '/' and can
# make restored shells exit through tmux-resurrect's command wrapper.
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim  'session'
set -g @resurrect-save 'S'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# set -g window-active-style 'bg=colour0'

run -b '~/.tmux/plugins/tpm/tpm'

# После загрузки baseline восстановить выбранный private presentation profile.
run -b 'python3 "$HOME/dots/scripts/dots-tmux-style.py" --current'
