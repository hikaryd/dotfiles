set -g default-terminal "tmux-256color"

set -g terminal-overrides 'linux*:AX@,*256col*:RGB,*:Smulx=\E[4::%p1%dm,*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g set-clipboard on
set -s copy-command pbcopy
set -g terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:extkeys:hyperlinks:sync,screen*:title,rxvt*:ignorefkeys'
set -g extended-keys on
set -s extended-keys-format csi-u
# Jcode wraps Kitty graphics in tmux passthrough itself.
set -g allow-passthrough on

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g detach-on-destroy off
set -g focus-events on
set -g renumber-windows on
# 1M-line buffers made copy-mode allocations slow; 200k is still generous.
set -g history-limit 200000
set -g mouse on
setw -g mode-keys vi

set -g default-shell "/opt/homebrew/bin/zsh"
# Интерактивно — Nu, служебные run-shell остаются совместимыми с POSIX.
set -g default-command 'exec "$HOME/.local/bin/dots-nu"'
set-environment -g SHELL "/opt/homebrew/bin/zsh"

# Агенты пишут тему задачи в pane_title; у обычного shell там hostname.
set -g set-titles on
set -g set-titles-string '#S · #W'
setw -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{||:#{==:#{pane_title},#{host}},#{==:#{pane_title},#{host_short}}},#{b:pane_current_path},#{=/24/...:#{s/ · .*//:pane_title}}}'

# Sessions = workspaces, windows = tabs.
bind d detach-client
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded"
bind u choose-tree -sZ
bind B choose-tree -Z
bind [ switch-client -p
bind ] switch-client -n
bind L switch-client -l
bind N command-prompt -p 'New workspace' 'new-session -c "#{pane_current_path}" -s "%%"'
bind W command-prompt -I '#S' -p 'Rename workspace' 'rename-session "%%"'
bind D confirm-before -p 'Close workspace #S? (y/n)' kill-session
bind c new-window -c '#{pane_current_path}'
bind , command-prompt -I '#W' -p 'Rename tab' 'rename-window "%%"'
bind < command-prompt -I '#{pane_title}' -p 'Rename pane' 'select-pane -T "%%"'
bind b previous-window
bind n next-window
bind w kill-window
bind -n C-w kill-pane
bind -n C-S-Left swap-window -d -t -1
bind -n C-S-Right swap-window -d -t +1
bind -n C-1 select-window -t :1
bind -n C-2 select-window -t :2
bind -n C-3 select-window -t :3
bind -n C-4 select-window -t :4
bind -n C-5 select-window -t :5
bind -n C-6 select-window -t :6
bind -n C-7 select-window -t :7
bind -n C-8 select-window -t :8
bind -n C-9 select-window -t :9

bind | split-window -h -c '#{pane_current_path}'
bind _ split-window -v -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind Space last-pane
bind Enter last-pane
bind H swap-pane -U
bind J swap-pane -D
bind m resize-pane -Z
bind f resize-pane -Z
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R
bind h resize-pane -L 5
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind R switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize р resize-pane -L 5 \; switch-client -T resize
bind -T resize о resize-pane -D 5 \; switch-client -T resize
bind -T resize л resize-pane -U 5 \; switch-client -T resize
bind -T resize д resize-pane -R 5 \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root
bind -n C-S-h resize-pane -L 5
bind -n C-S-j resize-pane -D 5
bind -n C-S-k resize-pane -U 5
bind -n C-S-l resize-pane -R 5

bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Popup jobs have no pane: pass the source pane and the client that opened them.
bind g display-popup -EE -w 90% -h 90% -T ' lazygit ' -d '#{pane_current_path}' 'lazygit --use-config-file ~/.config/lazygit/config.yml'
bind T run-shell -C "display-popup -E -w 75% -h 70% -T ' sessions ' -d '##{pane_current_path}' 'DOTS_SOURCE_PANE=#{pane_id} DOTS_MUX_CLIENT=#{client_name} exec ~/.local/bin/dots sessions open'"
bind P run-shell -C "display-popup -E -w 75% -h 70% -T ' projects ' -d '##{pane_current_path}' 'DOTS_SOURCE_PANE=#{pane_id} DOTS_MUX_CLIENT=#{client_name} exec ~/.local/bin/dots projects open'"
bind O run-shell -C "display-popup -EE -w 85% -h 80% -T ' dots ' -d '##{pane_current_path}' 'DOTS_SOURCE_PANE=#{pane_id} DOTS_MUX_CLIENT=#{client_name} exec ~/.local/bin/dots menu'"
bind F run-shell -C "display-popup -E -w 85% -h 75% -T ' references ' -d '##{pane_current_path}' 'exec ~/.local/bin/dots refs --pane #{pane_id}'"
bind Y display-popup -EE -w 80% -h 75% -T ' clipboard ' 'exec ~/.local/bin/dots clip'
bind V run-shell -C "display-popup -E -w 95% -h 90% -T ' project status ' -d '##{pane_current_path}' 'DOTS_SOURCE_PANE=#{pane_id} DOTS_MUX_CLIENT=#{client_name} exec ~/.local/bin/dots status --interactive'"

# Те же физические клавиши в русской раскладке, без системного переключения.
bind в detach-client
bind к source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded"
bind г choose-tree -sZ
bind И choose-tree -Z
bind х switch-client -p
bind ъ switch-client -n
bind Д switch-client -l
bind Т command-prompt -p 'New workspace' 'new-session -c "#{pane_current_path}" -s "%%"'
bind Ц command-prompt -I '#S' -p 'Rename workspace' 'rename-session "%%"'
bind В confirm-before -p 'Close workspace #S? (y/n)' kill-session
bind с new-window -c '#{pane_current_path}'
bind б command-prompt -I '#W' -p 'Rename tab' 'rename-window "%%"'
bind Б command-prompt -I '#{pane_title}' -p 'Rename pane' 'select-pane -T "%%"'
bind и previous-window
bind т next-window
bind ц kill-window
bind Р swap-pane -U
bind О swap-pane -D
bind ь resize-pane -Z
bind а resize-pane -Z
bind р resize-pane -L 5
bind о resize-pane -D 5
bind л resize-pane -U 5
bind д resize-pane -R 5
bind К switch-client -T resize
bind м copy-mode
bind -T copy-mode-vi м send -X begin-selection
bind -T copy-mode-vi М send -X begin-selection
bind -T copy-mode-vi н send -X copy-pipe-and-cancel
bind -T copy-mode-vi Н send -X copy-pipe-and-cancel
bind п display-popup -EE -w 90% -h 90% -T ' lazygit ' -d '#{pane_current_path}' 'lazygit --use-config-file ~/.config/lazygit/config.yml'
bind Е run-shell -C "display-popup -E -w 75% -h 70% -T ' sessions ' -d '##{pane_current_path}' 'DOTS_SOURCE_PANE=#{pane_id} DOTS_MUX_CLIENT=#{client_name} exec ~/.local/bin/dots sessions open'"
bind З run-shell -C "display-popup -E -w 75% -h 70% -T ' projects ' -d '##{pane_current_path}' 'DOTS_SOURCE_PANE=#{pane_id} DOTS_MUX_CLIENT=#{client_name} exec ~/.local/bin/dots projects open'"
bind Щ run-shell -C "display-popup -EE -w 85% -h 80% -T ' dots ' -d '##{pane_current_path}' 'DOTS_SOURCE_PANE=#{pane_id} DOTS_MUX_CLIENT=#{client_name} exec ~/.local/bin/dots menu'"
bind А run-shell -C "display-popup -E -w 85% -h 75% -T ' references ' -d '##{pane_current_path}' 'exec ~/.local/bin/dots refs --pane #{pane_id}'"
bind Н display-popup -EE -w 80% -h 75% -T ' clipboard ' 'exec ~/.local/bin/dots clip'
bind М run-shell -C "display-popup -E -w 95% -h 90% -T ' project status ' -d '##{pane_current_path}' 'DOTS_SOURCE_PANE=#{pane_id} DOTS_MUX_CLIENT=#{client_name} exec ~/.local/bin/dots status --interactive'"

# Quiet Ayu: фокус обозначается границей, не яркими плашками.
# terminal явно сохраняет настоящий фон Ghostty в обоих состояниях.
set -g window-style 'bg=terminal'
set -g window-active-style 'bg=terminal'
# Сброс DECSCUSR в tmux иначе превращает Ghostty bar в block.
set -g cursor-style bar
set -g pane-border-style 'fg=#282828'
set -g pane-active-border-style 'fg=#ffc799'
set -g pane-border-lines single
set -g pane-border-indicators off
# Заголовки на рамках только при сплите: одиночная панель не теряет строку.
set -g pane-border-status off
set-hook -g window-layout-changed 'set -wF pane-border-status "#{?#{!=:#{window_panes},1},top,off}"'
set -g pane-border-format '#{?pane_active,#[fg=#ffc799],#[fg=#505050]} #{pane_index} · #{?#{||:#{==:#{pane_title},#{host}},#{==:#{pane_title},#{host_short}}},#{b:pane_current_path},#{=/48/...:pane_title}} '

set -g status on
set -g status-position top
# The only time field changes once per minute.
set -g status-interval 60
set -g status-justify left
set -g status-style 'bg=default,fg=#a0a0a0'
set -g status-left-length 28
set -g status-right-length 36
set -g status-left '#[fg=#181818,bg=default]#[fg=#99ffe4,bg=#181818]  #[fg=#ffffff]#{=/18/...:session_name} #[fg=#181818,bg=default]  '
set -g status-right '#{?client_prefix,#[fg=#ffc799] PREFIX ,}#{?pane_in_mode,#[fg=#ffc799] COPY ,}#{?window_zoomed_flag,#[fg=#ffc799] ZOOM ,}#[fg=#a0a0a0] %H:%M '

set -g window-status-separator ' '
set -g window-status-style 'bg=default,fg=#a0a0a0'
set -g window-status-format ' #I #{=/16/...:window_name}#{?window_activity_flag, ·,}#{?window_bell_flag, !,} '
set -g window-status-current-format '#[fg=#232323,bg=default]#[fg=#ffc799,bg=#232323,bold] #I #[fg=#ffffff]#{=/16/...:window_name} #[fg=#232323,bg=default]'
set -g window-status-bell-style 'bg=default,fg=#ff8080'
set -g window-status-activity-style 'bg=default,fg=#ffc799'
set -g window-status-last-style 'bg=default,fg=#a0a0a0'

set -g mode-style 'bg=#232323,fg=#ffffff'
set -g copy-mode-match-style 'bg=#232323,fg=#ffc799'
set -g copy-mode-current-match-style 'bg=#ffc799,fg=#101010,bold'
set -g copy-mode-mark-style 'bg=#99ffe4,fg=#101010,bold'
set -g copy-mode-position-style 'bg=#232323,fg=#ffc799'
set -g copy-mode-position-format ' COPY · %position · %scroll_percentage '
set -g message-style 'bg=#232323,fg=#ffffff'
set -g message-command-style 'bg=#232323,fg=#ffc799'
set -g popup-style 'bg=#101010,fg=#ffffff'
set -g popup-border-style 'fg=#ffc799'
set -g popup-border-lines rounded
set -g menu-style 'bg=#101010,fg=#ffffff'
set -g menu-selected-style 'bg=#232323,fg=#ffc799,bold'
set -g menu-border-lines rounded
set -g clock-mode-colour '#ffc799'
set -g display-panes-colour '#a0a0a0'
set -g display-panes-active-colour '#ffc799'
set -g display-panes-time 1500

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
# Pane text is not durable state and breaks on session names containing '/'.
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim  'session'
set -g @resurrect-save 'S'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run -b '~/.tmux/plugins/tpm/tpm'

# После загрузки baseline восстановить выбранный private presentation profile.
run -b '"$HOME/dots/build/bin/dots" tmux-style --current'
