# Цвета выше генерирует dots-tools palette.
# В ~/.config/shitty файл попадает через dots shitty-config (./install, dots style).
# Shell не задан: Shitty.app передаёт dots-terminal через SHELL, а st из CLI берёт обычный shell.

font = ["JetBrainsMono Nerd Font Mono", "JetBrains Mono", "monospace"]
fontsize = 15
border = 16
# Без заголовка; rift раскладывает такое окно только с manage = true в app_rules.
no-decorations = true
# Ctrl+цифры и Ctrl+Shift всегда расширенным кодом: иначе после сброса режима
# программой Ctrl+2..8 уходят как NUL/ESC/FS..., tmux их не узнаёт, а ESC дёргает Claude CLI.
modifyOtherKeys = 2
