id = "dots.task-titles"
name = "Agent task titles"
version = "0.3.0"
min_herdr_version = "0.9.1"
description = "Native Codex/Pi task titles on pane borders and automatic tabs"
platforms = ["macos", "linux"]

[[startup]]
command = ["dots-task-titles", "sync"]

[[events]]
on = "pane.agent_status_changed"
command = ["dots-task-titles", "sync"]

[[events]]
on = "pane.focused"
command = ["dots-task-titles", "sync"]

[[events]]
on = "pane.agent_detected"
command = ["dots-task-titles", "sync"]

[[events]]
on = "pane.closed"
command = ["dots-task-titles", "sync"]

[[events]]
on = "pane.exited"
command = ["dots-task-titles", "sync"]

[[events]]
on = "pane.moved"
command = ["dots-task-titles", "sync"]

[[events]]
on = "tab.focused"
command = ["dots-task-titles", "sync"]

[[events]]
on = "tab.renamed"
command = ["dots-task-titles", "sync"]

[[actions]]
id = "sync"
title = "Refresh agent task titles"
contexts = ["workspace"]
command = ["dots-task-titles", "sync"]
