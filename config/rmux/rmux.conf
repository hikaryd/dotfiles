# Native RMUX profile. Herdr and its live processes stay available separately.
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g default-terminal tmux-256color
set -g default-shell /opt/homebrew/bin/zsh
set -g default-command 'exec "$HOME/.local/bin/dots-nu"'
set -g escape-time 0
set -g extended-keys on
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g history-limit 200000
set -g mouse off
set -s set-clipboard on
set -s copy-command pbcopy
setw -g mode-keys vi

# Workspaces = sessions, tabs = windows. Keep the Herdr muscle memory.
bind d detach-client
bind r source-file ~/.config/rmux/rmux.conf
bind u choose-tree -sZ
bind [ switch-client -p
bind ] switch-client -n
bind L switch-client -l
bind N command-prompt -p 'New workspace' 'new-session -c "#{pane_current_path}" -s "%%"'
bind W command-prompt -I '#S' -p 'Rename workspace' 'rename-session "%%"'
bind D confirm-before -p 'Close workspace #S? (y/n)' kill-session
bind c new-window -c '#{pane_current_path}'
bind , command-prompt -I '#W' -p 'Rename tab' 'rename-window "%%"'
bind < command-prompt -I '#{pane_title}' -p 'Rename pane' 'select-pane -T "%%"'
bind b previous-window
bind n next-window
bind -n C-S-Left swap-window -d -t -1
bind -n C-S-Right swap-window -d -t +1
bind w kill-window
bind -n C-w kill-pane
bind Space last-pane
bind Enter last-pane
bind H swap-pane -U
bind : swap-pane -D
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R
bind h resize-pane -L 5
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind -n C-S-h resize-pane -L 5
bind -n C-S-j resize-pane -D 5
bind -n C-S-k resize-pane -U 5
bind -n C-S-l resize-pane -R 5
bind | split-window -h -c '#{pane_current_path}'
bind _ split-window -v -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind m resize-pane -Z
bind f resize-pane -Z
bind v copy-mode
bind B choose-tree -Z
bind R switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi м send-keys -X begin-selection
bind -T copy-mode-vi н send-keys -X copy-pipe-and-cancel

bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9
bind -n C-1 select-window -t :1
bind -n C-2 select-window -t :2
bind -n C-3 select-window -t :3
bind -n C-4 select-window -t :4
bind -n C-5 select-window -t :5
bind -n C-6 select-window -t :6
bind -n C-7 select-window -t :7
bind -n C-8 select-window -t :8
bind -n C-9 select-window -t :9

# Pin popup actions to their source client and pane, not the popup's own PTY.
bind T display-popup -E -w 75% -h 70% -d '#{pane_current_path}' 'DOTS_SOURCE_PANE=#{pane_id} DOTS_MUX_CLIENT=#{client_pid} exec dots sessions open'
bind g display-popup -E -w 90% -h 90% -d '#{pane_current_path}' 'lazygit --use-config-file ~/.config/lazygit/config.yml'
bind P display-popup -E -w 75% -h 70% -d '#{pane_current_path}' 'DOTS_SOURCE_PANE=#{pane_id} DOTS_MUX_CLIENT=#{client_pid} exec dots projects open'
bind O display-popup -E -w 85% -h 80% -d '#{pane_current_path}' 'DOTS_SOURCE_PANE=#{pane_id} DOTS_MUX_CLIENT=#{client_pid} exec dots menu'
bind F display-popup -E -w 85% -h 75% -d '#{pane_current_path}' 'DOTS_SOURCE_PANE=#{pane_id} exec dots refs'
bind Y display-popup -E -w 80% -h 75% 'dots clip'
bind V display-popup -E -w 95% -h 90% -d '#{pane_current_path}' 'DOTS_SOURCE_PANE=#{pane_id} DOTS_MUX_CLIENT=#{client_pid} exec dots status --interactive'

# Physical equivalents for Russian input. No system-wide layout switching.
bind в detach-client
bind к source-file ~/.config/rmux/rmux.conf
bind г choose-tree -sZ
bind х switch-client -p
bind ъ switch-client -n
bind д resize-pane -R 5
bind р resize-pane -L 5
bind о resize-pane -D 5
bind л resize-pane -U 5
bind с new-window -c '#{pane_current_path}'
bind и previous-window
bind т next-window
bind ц kill-window
bind ь resize-pane -Z
bind а resize-pane -Z
bind м copy-mode
bind Д switch-client -l
bind И choose-tree -Z
bind Т command-prompt -p 'New workspace' 'new-session -c "#{pane_current_path}" -s "%%"'
bind Ц command-prompt -I '#S' -p 'Rename workspace' 'rename-session "%%"'
bind В confirm-before -p 'Close workspace #S? (y/n)' kill-session
bind К switch-client -T resize
bind Р swap-pane -U
bind Ж swap-pane -D
bind б command-prompt -I '#W' -p 'Rename tab' 'rename-window "%%"'
bind Б command-prompt -I '#{pane_title}' -p 'Rename pane' 'select-pane -T "%%"'
bind Е display-popup -E -w 75% -h 70% -d '#{pane_current_path}' 'DOTS_SOURCE_PANE=#{pane_id} DOTS_MUX_CLIENT=#{client_pid} exec dots sessions open'
bind п display-popup -E -w 90% -h 90% -d '#{pane_current_path}' 'lazygit --use-config-file ~/.config/lazygit/config.yml'
bind З display-popup -E -w 75% -h 70% -d '#{pane_current_path}' 'DOTS_SOURCE_PANE=#{pane_id} DOTS_MUX_CLIENT=#{client_pid} exec dots projects open'
bind Щ display-popup -E -w 85% -h 80% -d '#{pane_current_path}' 'DOTS_SOURCE_PANE=#{pane_id} DOTS_MUX_CLIENT=#{client_pid} exec dots menu'
bind А display-popup -E -w 85% -h 75% -d '#{pane_current_path}' 'DOTS_SOURCE_PANE=#{pane_id} exec dots refs'
bind Н display-popup -E -w 80% -h 75% 'dots clip'
bind М display-popup -E -w 95% -h 90% -d '#{pane_current_path}' 'DOTS_SOURCE_PANE=#{pane_id} DOTS_MUX_CLIENT=#{client_pid} exec dots status --interactive'

# Quiet Ayu, native terminal background and task titles from OSC output.
set -g status on
set -g status-position top
set -g status-interval 30
set -g status-justify centre
set -g status-style 'bg=default,fg=#858d9c'
set -g status-left-length 40
set -g status-left '#[fg=#95e6cb] #S #[default] '
set -g status-right-length 50
set -g status-right '#{?client_prefix,#[fg=#e6b450] PREFIX ,}#{?window_zoomed_flag,#[fg=#73d0ff] ZOOM ,}#[fg=#858d9c] %H:%M '
set -g window-status-separator ' '
set -g window-status-format ' #I #W '
set -g window-status-current-format '#[fg=#273747]#[bg=#273747,fg=#73d0ff,bold] #I #[fg=#bfbdb6]#W #[bg=default,fg=#273747]'
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'
set -g pane-border-style 'fg=#303847'
set -g pane-active-border-style 'fg=#73d0ff'
set -g pane-border-status top
set -g pane-border-format ' #{pane_index} · #{pane_title} '
set -g mode-style 'bg=#273747,fg=#bfbdb6'
set -g message-style 'bg=#273747,fg=#bfbdb6'
set -g popup-style 'bg=#0d1017,fg=#bfbdb6'
set -g popup-border-style 'fg=#73d0ff'
set -g popup-border-lines rounded
set -g set-titles on
set -g set-titles-string '#S · #W'
setw -g automatic-rename on
setw -g automatic-rename-format '#{pane_title}'
setw -g allow-rename off
