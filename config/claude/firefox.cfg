// Managed proxy configuration. The kernel firewall remains the network boundary.
lockPref("network.proxy.type", 1);
lockPref("network.proxy.http", getenv("GUARD_PROXY_HOST"));
lockPref("network.proxy.http_port", parseInt(getenv("GUARD_PROXY_PORT"), 10));
lockPref("network.proxy.ssl", getenv("GUARD_PROXY_HOST"));
lockPref("network.proxy.ssl_port", parseInt(getenv("GUARD_PROXY_PORT"), 10));
lockPref("network.proxy.share_proxy_settings", true);
lockPref("network.proxy.no_proxies_on", "");
lockPref("network.proxy.allow_hijacking_localhost", true);
lockPref("network.proxy.proxy_over_tls", getenv("GUARD_PROXY_TLS") === "1");
lockPref("network.trr.mode", 5);
lockPref("media.peerconnection.enabled", false);
lockPref("network.http.http3.enable", false);
lockPref("network.dns.disablePrefetch", true);
lockPref("network.prefetch-next", false);
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("toolkit.telemetry.enabled", false);

(() => {
  const { classes: Cc, interfaces: Ci } = Components;
  const file = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
  file.initWithPath("/run/guard/proxy-auth.json");
  const input = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
  input.init(file, 0x01, 0, 0);
  const stream = Cc["@mozilla.org/scriptableinputstream;1"].createInstance(Ci.nsIScriptableInputStream);
  stream.init(input);
  let credentials;
  try {
    if (stream.available() > 65536) throw new Error("Invalid proxy authentication input");
    credentials = JSON.parse(stream.read(stream.available()));
  } catch (_) {
    throw new Error("Invalid proxy authentication input");
  } finally {
    stream.close();
    file.remove(false);
  }
  const host = getenv("GUARD_PROXY_HOST");
  const port = Number(getenv("GUARD_PROXY_PORT"));
  if (typeof credentials.username !== "string" || typeof credentials.password !== "string") {
    throw new Error("Invalid proxy authentication input");
  }
  const { LoginManagerAuthPrompter } = ChromeUtils.importESModule(
    "resource://gre/modules/LoginManagerAuthPrompter.sys.mjs"
  );
  const prototype = LoginManagerAuthPrompter.prototype;
  const original = prototype.promptAuthInternal;
  if (typeof original !== "function") throw new Error("Unsupported Firefox authentication interface");
  prototype.promptAuthInternal = async function (channel, level, authInfo) {
    if (!(authInfo.flags & Ci.nsIAuthInformation.AUTH_PROXY)) {
      return original.call(this, channel, level, authInfo);
    }
    const proxy = channel.QueryInterface(Ci.nsIProxiedChannel).proxyInfo;
    if (!proxy || proxy.host !== host || proxy.port !== port ||
        proxy.type !== (getenv("GUARD_PROXY_TLS") === "1" ? "https" : "http") ||
        authInfo.flags & Ci.nsIAuthInformation.PREVIOUS_FAILED || !credentials.username) {
      return false;
    }
    authInfo.username = credentials.username;
    authInfo.password = credentials.password;
    return true;
  };
  const ready = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
  ready.initWithPath("/run/guard/auth-ready");
  ready.create(Ci.nsIFile.NORMAL_FILE_TYPE, 0o600);
})();
