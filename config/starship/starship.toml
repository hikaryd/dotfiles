# Конфигурация Starship

# Тема
palette = "ayu_dark"

# Формат
format = "$os$username${custom.is_folder_config}$directory$git_branch$c$rust$golang$nodejs$php$java$kotlin$haskell$lua$python$cmake$docker_context$meson$cmd_duration$line_break$character"

add_newline = true

# Операционная система
[os]
disabled = false
style = "bg:color_mantle fg:color_text"

[os.symbols]
Windows = "󰍲 "
Ubuntu = "󰕈 "
SUSE = " "
Raspbian = "󰐿 "
Mint = "󰣭 "
Macos = "󰀵 "
Manjaro = " "
Linux = "󰌽 "
Gentoo = "󰣨 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Android = " "
Arch = "󰣇 "
Artix = "󰣇 "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "

# Продолжительность выполнения команды
[cmd_duration]
min_time = 1000
show_notifications = false
min_time_to_notify = 10000
show_milliseconds = true
format = "[$duration ]($style)"
style = "fg:color_pink bg:color_mantle"

# Директория
[directory]
truncate_to_repo = true
format = "[([$read_only ]($style fg:color_red))$path ]($style)"
style = "fg:color_text bg:color_mantle"
truncation_length = 5
read_only = ""

# Git
[git_branch]
symbol = ""
format = "[$symbol $branch(:$remote_branch) ]($style)"
style = "fg:color_red bg:color_mantle"

[git_status]
disabled = false

[git_commit]
disabled = true
only_detached = false
tag_disabled = false
format = "[$tag #$hash ]($style)"
style = "fg:color_red bg:color_mantle"
commit_hash_length = 4
tag_symbol = ""

# Языки программирования
[c]
symbol = "gcc: "
format = "[$symbol($version )]($style)"
style = "fg:color_lavender bg:color_mantle"

[docker_context]
symbol = " "
format = "[$symbol$context ]($style)"
style = "fg:color_blue bg:color_mantle"

[golang]
symbol = ""
format = "[$symbol ($version )]($style)"
style = "fg:color_lavender bg:color_mantle"

[lua]
symbol = ""
format = "[$symbol ($version )]($style)"
style = "fg:color_lavender bg:color_mantle"

[nodejs]
symbol = ""
format = "[$symbol ($version )]($style)"
style = "fg:color_lavender bg:color_mantle"

[python]
symbol = " "
format = "[${symbol}${version}( $virtualenv)]($style) "
style = "fg:color_lavender"
detect_env_vars = ['VIRTUAL_ENV']

[rust]
symbol = ""
format = "[$symbol ($version )]($style)"
style = "fg:color_lavender bg:color_mantle"

[cmake]
format = "[$symbol($version )]($style)"
style = "fg:color_lavender bg:color_mantle"

[meson]
symbol = "Meson: "
format = "[$symbol(${project}) ]($style)"
style = "fg:color_lavender bg:color_mantle"

# Пользовательские
[custom.is_folder_config]
disabled = true
when = "echo $PWD | grep -q '/dotfiles'"
symbol = " "
format = "[$symbol]($style)"
style = "fg:color_blue bg:color_mantle"

# Прочее
[shell]
disabled = true

[line_break]
disabled = false

[status]
disabled = false
style = "fg:color_text bg:color_base"
format = '''
[
(Exit code: [$maybe_int]($style fg:color_red))
(Exit status: [$common_meaning]($style fg:color_peach))
(Signal: [$signal_name]($style fg:color_yellow))]
($style)
'''

[character]
format = "> "
disabled = false

# Палитра Ayu Dark
[palettes.ayu_dark]
color_rosewater = "#f07178"
color_flamingo = "#f29668"
color_pink = "#f07178"
color_mauve = "#ff8f40"
color_red = "#f07178"
color_maroon = "#f07178"
color_peach = "#f29668"
color_yellow = "#ffb454"
color_green = "#aad94c"
color_teal = "#95e6cb"
color_sky = "#39bae6"
color_sapphire = "#59c2ff"
color_blue = "#39bae6"
color_lavender = "#d2a6ff"
color_text = "#bfbdb6"
color_subtext1 = "#bfbdb6"
color_subtext0 = "#555e73"
color_overlay2 = "#555e73"
color_overlay1 = "#555e73"
color_overlay0 = "#555e73"
color_surface2 = "#4d5566"
color_surface1 = "#3e4451"
color_surface0 = "#1b1f29"
color_base = "#0d1017"
color_mantle = "#0d1017"
color_crust = "#0d1017"
