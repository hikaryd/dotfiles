# Конфигурация Starship

# Тема
palette = "ayu_dark"

# Формат
format = "$os$username${custom.is_folder_config}$directory$git_branch$c$rust$golang$nodejs$php$java$kotlin$haskell$lua$python$cmake$docker_context$meson$cmd_duration$line_break$character"

add_newline = true

# Операционная система
[os]
disabled = false
style = "fg:color_subtext0"

[os.symbols]
Windows = "󰍲 "
Ubuntu = "󰕈 "
SUSE = " "
Raspbian = "󰐿 "
Mint = "󰣭 "
Macos = "󰀵 "
Manjaro = " "
Linux = "󰌽 "
Gentoo = "󰣨 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Android = " "
Arch = "󰣇 "
Artix = "󰣇 "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "

# Продолжительность выполнения команды
[cmd_duration]
min_time = 3000
show_notifications = false
min_time_to_notify = 10000
show_milliseconds = false
format = "[$duration ]($style)"
style = "fg:color_subtext0"

# Директория
[directory]
truncate_to_repo = true
format = "[([$read_only ]($style fg:color_red))$path ]($style)"
style = "fg:color_text"
truncation_length = 5
read_only = ""

# Git
[git_branch]
symbol = ""
format = "[$branch(:$remote_branch) ]($style)"
style = "fg:color_subtext0"

[git_status]
disabled = false

[git_commit]
disabled = true
only_detached = false
tag_disabled = false
format = "[$tag #$hash ]($style)"
style = "fg:color_red"
commit_hash_length = 4
tag_symbol = ""

# Языки программирования
[c]
symbol = "gcc: "
format = "[$symbol($version )]($style)"
style = "fg:color_subtext0"

[docker_context]
symbol = " "
format = "[$symbol$context ]($style)"
style = "fg:color_blue"

[golang]
symbol = ""
format = "[$symbol ($version )]($style)"
style = "fg:color_subtext0"

[lua]
symbol = ""
format = "[$symbol ($version )]($style)"
style = "fg:color_subtext0"

[nodejs]
symbol = ""
format = "[$symbol ($version )]($style)"
style = "fg:color_subtext0"

[python]
symbol = " "
format = "[${symbol}${version}( $virtualenv)]($style) "
style = "fg:color_subtext0"
detect_env_vars = ['VIRTUAL_ENV']

[rust]
symbol = ""
format = "[$symbol ($version )]($style)"
style = "fg:color_subtext0"

[cmake]
format = "[$symbol($version )]($style)"
style = "fg:color_subtext0"

[meson]
symbol = "Meson: "
format = "[$symbol(${project}) ]($style)"
style = "fg:color_subtext0"

# Пользовательские
[custom.is_folder_config]
disabled = true
when = "echo $PWD | grep -q '/dotfiles'"
symbol = " "
format = "[$symbol]($style)"
style = "fg:color_blue"

# Прочее
[shell]
disabled = true

[line_break]
disabled = false

[status]
disabled = false
style = "fg:color_text"
format = '''
[
(Exit code: [$maybe_int]($style fg:color_red))
(Exit status: [$common_meaning]($style fg:color_peach))
(Signal: [$signal_name]($style fg:color_yellow))]
($style)
'''

[character]
format = "$symbol "
success_symbol = "[>](fg:color_blue)"
error_symbol = "[!](fg:color_red)"
vimcmd_symbol = "[<](fg:color_teal)"
disabled = false

# Палитра Ayu Dark
[palettes.ayu_dark]
color_rosewater = "#ff8080"
color_flamingo = "#b0b0b0"
color_pink = "#ff8080"
color_mauve = "#b0b0b0"
color_red = "#ff8080"
color_maroon = "#ff8080"
color_peach = "#b0b0b0"
color_yellow = "#ffc799"
color_green = "#50b5aa"
color_teal = "#50b5aa"
color_sky = "#ffc799"
color_sapphire = "#ffc799"
color_blue = "#ffc799"
color_lavender = "#ffc799"
color_text = "#ffffff"
color_subtext1 = "#ffffff"
color_subtext0 = "#a0a0a0"
color_overlay2 = "#a0a0a0"
color_overlay1 = "#a0a0a0"
color_overlay0 = "#a0a0a0"
color_surface2 = "#505050"
color_surface1 = "#181818"
color_surface0 = "#232323"
color_base = "#101010"
color_mantle = "#101010"
color_crust = "#101010"
