[theme]
name = "Ayu Dark"

[font]
family = "SF Mono"
size = 15
# Высота ячейки в единицах Attyx; не процент Ghostty.
cell_height = 22
fallback = ["Symbols Nerd Font Mono", "Noto Color Emoji"]

[background]
opacity = 0.94
blur = 18

[window]
decorations = false
padding_x = 18
padding_y = 14

[cursor]
shape = "block"
blink = false

[program]
shell = "/opt/homebrew/bin/nu"
args = ["-l"]

[keybindings]
close_window = "none"
new_window = "none"
