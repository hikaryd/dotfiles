# AeroSpace configuration — синхронизировано с rift/config.toml.
# workspace_names в rift: ["1", "2", "3", "4", "e", "q", "t", "w", "d"]

start-at-login = false
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Mouse behavior — телепорт курсора в центр окна при переключении фокуса.
# `lazy` = курсор летит, только если он вне нового окна (полезно для
# мультимонитора: при alt+H/L между экранами курсор всегда оказывается
# в фокусе).
on-focus-changed = ['move-mouse window-lazy-center']

# Default layout — rift "traditional" ≈ aerospace tiles/auto
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 5

# Gaps — rift outer=0, inner=0
[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

# ============================================
# Workspace → Monitor force assignment.
# Каждый воркспейс физически живёт на конкретном мониторе.
# Идентификаторы: 'main' (главный), 'secondary' (второй), либо индекс
# (1, 2, ...). Если монитор отключён — воркспейс остаётся доступен
# на любом подключённом.
# ============================================
[workspace-to-monitor-force-assignment]
1 = 'secondary'
2 = 'secondary'
3 = 'secondary'
4 = 'secondary'
q = 'secondary'
e = 'secondary'
w = 'secondary'
t = 'secondary'

# ============================================
# Key bindings (rift parity)
# ============================================
[mode.main.binding]

# --- Переключение воркспейсов (Alt + key) — rift switch_to_workspace ---
#: повторное нажатие хоткея текущего воркспейса
# возвращает на предыдущий (как `alt+tab`, но прозрачно).
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-d = 'workspace d'
alt-e = 'workspace e'
alt-q = 'workspace q'
alt-t = 'workspace t'
alt-w = 'workspace w'

# Switch to last workspace (Alt + Tab) — rift switch_to_last_workspace
alt-tab = 'workspace-back-and-forth'

# --- Отправка окна на воркспейс (Alt + Shift + key) — rift comb1 + key ---
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-d = 'move-node-to-workspace d'
alt-shift-e = 'move-node-to-workspace e'
alt-shift-q = 'move-node-to-workspace q'
alt-shift-t = 'move-node-to-workspace t'
alt-shift-w = 'move-node-to-workspace w'

# --- Навигация (Alt + H/J/K/L) — rift move_focus ---
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# --- Перемещение окон (Alt + Shift + H/J/K/L) — rift move_node ---
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# --- Стек/джойн (Cmd + Shift + keys) — rift Meta+Shift J/H/L ---
cmd-shift-j = 'layout accordion tiles' # toggle_stack
cmd-shift-h = 'join-with left'         # join_window left
cmd-shift-l = 'join-with right'        # join_window right

# --- Ресайз (Alt + Shift + =/-) — rift resize_window_grow / shrink ---
alt-shift-equal = 'resize smart +50'
alt-shift-minus = 'resize smart -50'

# --- Флоат/фуллскрин — rift toggle_window_floating / toggle_fullscreen ---
alt-space = 'layout floating tiling'   # Alt+Space
cmd-shift-f = 'layout floating tiling' # Meta+Shift+F
alt-f = 'fullscreen'                   # Alt+F

# --- Layouts ---
# Toggle между tiles и accordion. Accordion: одно окно полностью видно,
# остальные сжаты до полоски — удобно для логов / больших документов.
# Повторное нажатие циклит обратно к tiles.
alt-shift-a = 'layout tiles accordion'

# --- Сервисные ---
alt-ctrl-s = 'reload-config'           # ближе к rift "serialize"
cmd-shift-q = 'close'                  # Meta+Shift+Q (rift save_and_exit)
alt-shift-f = 'flatten-workspace-tree'

# --- Мультимонитор (нет в rift; полезное дополнение) ---
alt-comma = 'focus-monitor prev'
alt-period = 'focus-monitor next'
alt-shift-comma = 'move-node-to-monitor prev'
alt-shift-period = 'move-node-to-monitor next'

# ============================================
# Window rules (rift app_rules parity)
# ============================================

# --- Floating: окна настроек браузеров (rift: floating + ws=1) ---
[[on-window-detected]]
if.app-id = 'com.apple.Safari'
if.window-title-regex-substring = '^(General|(Tab|Password|Website|Extension)s|AutoFill|Se(arch|curity)|Privacy|Advance)$|Preferences|Настройки'
run = ['layout floating', 'move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'com.brave.Browser'
if.window-title-regex-substring = '^(General|Tabs?|Passwords?|Websites?|Extensions?|AutoFill|Search|Security|Privacy|Advance)$|Preferences|Settings'
