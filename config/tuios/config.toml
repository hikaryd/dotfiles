# Daily TUIOS profile. Herdr workspace = session, tab = workspace, pane = window.
# Ctrl+A remains the prefix. Press it twice to send Ctrl+A to the application.
[appearance]
theme = "ayu-dots"
max_fps = 120
motion = "basic"
background = "off"
dock_background = "off"
border_style = "rounded"
border_focused_color = "#73d0ff"
border_unfocused_color = "#303847"
shared_borders = true
dockbar_position = "top"
dock_workspace_tab_format = "{index} {name}{zoom}"
dock_workspace_label_max = 22
dock_pill_caps = true
window_title_position = "top"
window_title_format = "{title}"
window_title_style = "pill"
show_clock = true
show_cpu = false
show_ram = false
hide_scrollbar = true
copy_on_select = false
dim_unfocused = 0
session_colors = false
new_window_inherit_cwd = true
# scripts/tuios supplies SHELL=dots-tuios-shell with an absolute path.
preferred_shell = ""

[appearance.sidebar]
enabled = false
sections = "sessions,agents,terminals"
background = "off"

[startup]
tiled = true
daemon = true

[daemon]
persist_scrollback = false
resume_agents = "ask"
agent_autodetect = true
agent_binaries = ["jcode", "pi"]

[dock]
left = ["mode", "workspaces"]
center = ["windows"]
right = ["session", "notifications", "clock", "session-controls"]

[dock.session]
format = "{session}"
fg = "#bfbdb6"

[dock.clock]
format = "15:04"

[dock.tabs]
style = "pill"
active_fg = "#0d1017"
active_bg = "#73d0ff"
active_bold = true
inactive_fg = "#858d9c"
attention_fg = "#e6b450"
show_add = true

[keybindings]
preset = "tmux"
leader_key = "ctrl+a"

[keybindings.global]
command_palette = ["ctrl+shift+p"]
close_window = ["ctrl+w"]
move_workspace_left = ["ctrl+shift+left"]
move_workspace_right = ["ctrl+shift+right"]
switch_workspace_1 = ["ctrl+1"]
switch_workspace_2 = ["ctrl+2"]
switch_workspace_3 = ["ctrl+3"]
switch_workspace_4 = ["ctrl+4"]
switch_workspace_5 = ["ctrl+5"]
switch_workspace_6 = ["ctrl+6"]
switch_workspace_7 = ["ctrl+7"]
switch_workspace_8 = ["ctrl+8"]
switch_workspace_9 = ["ctrl+9"]
resize_pane_left_5 = ["ctrl+shift+h"]
resize_pane_down_5 = ["ctrl+shift+j"]
resize_pane_up_5 = ["ctrl+shift+k"]
resize_pane_right_5 = ["ctrl+shift+l"]

[keybindings.terminal_mode]
terminal_focus_left = ["ctrl+h", "alt+left"]
terminal_focus_down = ["ctrl+j", "alt+down"]
terminal_focus_up = ["ctrl+k", "alt+up"]
terminal_focus_right = ["ctrl+l", "alt+right"]

[keybindings.prefix_mode]
new_workspace = ["c"]
prev_workspace = ["b"]
next_workspace = ["n"]
rename_workspace = [","]
close_workspace = ["w"]
last_workspace = []
prefix_workspace_switcher = ["tab"]
prefix_session_switcher = ["u"]
new_session = ["N"]
rename_session = ["W"]
prefix_close_session = ["D"]
last_session = ["L"]
prev_session = ["["]
next_session = ["]"]
prefix_transfers = []
prefix_split_vertical = ["|", "\\"]
prefix_split_horizontal = ["-", "_"]
prefix_fullscreen = ["m", "f"]
mark_pane = []
choose_tree = ["/"]
prefix_selection = ["v"]
prefix_review = []
last_pane = ["space", "enter"]
cycle_layout = []
resize_pane_left_5 = ["h"]
resize_pane_down_5 = ["j"]
resize_pane_up_5 = ["k"]
resize_pane_right_5 = ["l"]
swap_left = ["H"]
swap_right = [":"]
prefix_command_palette = []
prefix_toggle_sidebar = ["B"]
prefix_toggle_spotlight = []
prefix_toggle_other_rail = []
prefix_rename_window = ["<"]
prefix_rotate_split = []
prefix_inbox = ["i"]
paste_buffer = ["p"]
paste_image = []
prefix_screenshot = []
prefix_settings = ["C"]
hints = []
prefix_tape = []
prefix_next_finished = []
prefix_last_message = []
prefix_jump_notif = []
prefix_keybinds = []
toggle_scratch = []
"open_menu:resize" = ["R"]

[keybindings.menus.resize]
title = "Resize · hjkl · Esc to finish"
sticky = true
[keybindings.menus.resize.keys]
resize_pane_left_5 = ["h", "left"]
resize_pane_down_5 = ["j", "down"]
resize_pane_up_5 = ["k", "up"]
resize_pane_right_5 = ["l", "right"]

[[keybindings.command]]
name = "dots-lazygit"
key = "prefix+g"
type = "popup"
command = "lazygit --use-config-file ~/.config/lazygit/config.yml"
description = "Lazygit"
width = "90%"
height = "90%"

[[keybindings.command]]
name = "dots-sessions"
key = "prefix+T"
type = "popup"
command = "dots sessions open"
description = "Sessions"
width = "75%"
height = "70%"

[[keybindings.command]]
name = "dots-projects"
key = "prefix+P"
type = "popup"
command = "dots projects open"
description = "Projects"
width = "75%"
height = "70%"

[[keybindings.command]]
name = "dots-menu"
key = "prefix+O"
type = "popup"
command = "dots menu"
description = "Dots menu"
width = "85%"
height = "80%"

[[keybindings.command]]
name = "dots-refs"
key = "prefix+F"
type = "popup"
command = 'dots refs --pane "$HERDR_ACTIVE_PANE_ID"'
description = "URLs and paths"
width = "85%"
height = "75%"

[[keybindings.command]]
name = "dots-clipboard"
key = "prefix+Y"
type = "popup"
command = "dots clip"
description = "Clipboard"
width = "80%"
height = "75%"

[[keybindings.command]]
name = "dots-status"
key = "prefix+V"
type = "popup"
command = "dots status --interactive"
description = "System status"
width = "95%"
height = "90%"

[plugins]
dirs = ["~/dots/config/herdr/plugins/task-titles"]
