# Vesper dark: https://github.com/advtszn/dotfiles (853097851ea2cd7965c1939dd870f24ec3148681)
# Legacy Ayu paths and Mirage variant remain for compatibility.
#
# Запуск: dots-tools palette [--variant dark|mirage]

[meta]
name = "vesper"
default_variant = "dark"

# ─── Dark ────────────────────────────────────────────────────────────────────

[dark.editor]
bg      = "#101010"
fg      = "#ececec"
line    = "#1c1c1c"
panel   = "#181818"

[dark.ui]
fg      = "#a0a0a0"
bg      = "#101010"
line    = "#232323"
selection = "#2a2a2a"
border    = "#282828"
dim       = "#6c6c6c"
divider   = "#333333"

[dark.syntax]
tag      = "#ffc799"
func     = "#ffc799"
entity   = "#ffc799"
string   = "#99ffe4"
regexp   = "#6fd1c4"
markup   = "#ff8080"
keyword  = "#b0b0b0"
special  = "#ffc799"
comment  = "#8b8b8b"
constant = "#c8a8e0"
operator = "#b0b0b0"

# Vesper-оттенки той же светлоты: ANSI-цвета различимы, но не спорят с персиковым акцентом.
[dark.terminal]
black          = "#1c1c1c"
red            = "#ff8080"
green          = "#8fd3a5"
yellow         = "#ffc799"
blue           = "#8fb4e0"
magenta        = "#c8a8e0"
cyan           = "#6fd1c4"
white          = "#cfcfcf"
bright_black   = "#5c5c5c"
bright_red     = "#ffa3a3"
bright_green   = "#b3e8c2"
bright_yellow  = "#ffd9b8"
bright_blue    = "#b0cdef"
bright_magenta = "#dcc5ef"
bright_cyan    = "#99ffe4"
bright_white   = "#ffffff"

[dark.vcs]
added    = "#99ffe4"
modified = "#ffc799"
removed  = "#ff8080"

[dark.common]
accent = "#ffc799"
warning = "#ffc799"
error  = "#ff8080"
info   = "#8fb4e0"
hint   = "#c8a8e0"

# ─── Mirage ──────────────────────────────────────────────────────────────────

[mirage.editor]
bg      = "#1f2430"
fg      = "#cccac2"
line    = "#1a1f29"
panel   = "#282e3b"

[mirage.ui]
fg      = "#707a8c"
bg      = "#1f2430"
line    = "#171b24"
selection = "#34455a"
border    = "#414d60"
dim       = "#5c6773"
divider   = "#2d3443"

[mirage.syntax]
tag      = "#5ccfe6"
func     = "#ffd173"
entity   = "#73d0ff"
string   = "#d5ff80"
regexp   = "#95e6cb"
markup   = "#f28779"
keyword  = "#ffad66"
special  = "#ffdfb3"
comment  = "#6e7f97"
constant = "#dfbfff"
operator = "#f29e74"

[mirage.terminal]
black          = "#3e4451"
red            = "#f28779"
green          = "#d5ff80"
yellow         = "#ffd173"
blue           = "#5ccfe6"
magenta        = "#dfbfff"
cyan           = "#95e6cb"
white          = "#e6e1cf"
bright_black   = "#4d5566"
bright_red     = "#f28779"
bright_green   = "#d5ff80"
bright_yellow  = "#ffd173"
bright_blue    = "#73d0ff"
bright_magenta = "#dfbfff"
bright_cyan    = "#95e6cb"
bright_white   = "#ffffff"

[mirage.vcs]
added    = "#87d96c"
modified = "#80bfff"
removed  = "#f27983"

[mirage.common]
accent = "#73d0ff"
warning = "#ffcc66"
error  = "#ff6666"
info   = "#5ccfe6"
hint   = "#dfbfff"
