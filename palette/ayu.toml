# Vesper dark: https://github.com/advtszn/dotfiles (853097851ea2cd7965c1939dd870f24ec3148681)
# Legacy Ayu paths and Mirage variant remain for compatibility.
#
# Запуск: dots-tools palette [--variant dark|mirage]

[meta]
name = "vesper"
default_variant = "dark"

# ─── Dark ────────────────────────────────────────────────────────────────────

[dark.editor]
bg      = "#101010"
fg      = "#ffffff"
line    = "#1c1c1c"
panel   = "#181818"

[dark.ui]
fg      = "#a0a0a0"
bg      = "#101010"
line    = "#232323"
selection = "#232323"
border    = "#282828"

[dark.syntax]
tag      = "#ffc799"
func     = "#ffc799"
entity   = "#ffc799"
string   = "#99ffe4"
regexp   = "#50b5aa"
markup   = "#ff8080"
keyword  = "#b0b0b0"
special  = "#ffc799"
comment  = "#8b8b8b"
constant = "#ffc799"
operator = "#b0b0b0"

[dark.terminal]
black          = "#181818"
red            = "#ff8080"
green          = "#50b5aa"
yellow         = "#ffc799"
blue           = "#b0b0b0"
magenta        = "#ffc799"
cyan           = "#50b5aa"
white          = "#dadada"
bright_black   = "#505050"
bright_red     = "#ff8080"
bright_green   = "#99ffe4"
bright_yellow  = "#ffcfa8"
bright_blue    = "#b0b0b0"
bright_magenta = "#ffcfa8"
bright_cyan    = "#99ffe4"
bright_white   = "#ffffff"

[dark.vcs]
added    = "#99ffe4"
modified = "#ffc799"
removed  = "#ff8080"

[dark.common]
accent = "#ffc799"
warning = "#ffc799"
error  = "#ff8080"

# ─── Mirage ──────────────────────────────────────────────────────────────────

[mirage.editor]
bg      = "#1f2430"
fg      = "#cccac2"
line    = "#1a1f29"
panel   = "#282e3b"

[mirage.ui]
fg      = "#707a8c"
bg      = "#1f2430"
line    = "#171b24"
selection = "#34455a"
border    = "#414d60"

[mirage.syntax]
tag      = "#5ccfe6"
func     = "#ffd173"
entity   = "#73d0ff"
string   = "#d5ff80"
regexp   = "#95e6cb"
markup   = "#f28779"
keyword  = "#ffad66"
special  = "#ffdfb3"
comment  = "#6e7f97"
constant = "#dfbfff"
operator = "#f29e74"

[mirage.terminal]
black          = "#3e4451"
red            = "#f28779"
green          = "#d5ff80"
yellow         = "#ffd173"
blue           = "#5ccfe6"
magenta        = "#dfbfff"
cyan           = "#95e6cb"
white          = "#e6e1cf"
bright_black   = "#4d5566"
bright_red     = "#f28779"
bright_green   = "#d5ff80"
bright_yellow  = "#ffd173"
bright_blue    = "#73d0ff"
bright_magenta = "#dfbfff"
bright_cyan    = "#95e6cb"
bright_white   = "#ffffff"

[mirage.vcs]
added    = "#87d96c"
modified = "#80bfff"
removed  = "#f27983"

[mirage.common]
accent = "#73d0ff"
warning = "#ffcc66"
error  = "#ff6666"
