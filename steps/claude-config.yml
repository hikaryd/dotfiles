- shell:
    - command: bash scripts/claude-config.sh
      description: Настройки, правила, субагент, навыки и MCP Claude
      stdout: true
      stderr: true
    - command: |
        set -eu
        claude_bin="$HOME/.local/bin/claude"
        guard_base="$HOME/.local/share/claude-guard"
        guard_cfg="$HOME/.config/claude-guard/settings.json"
        [ -x "$claude_bin" ] && [ -x "$guard_base/current/node_modules/.bin/claude" ] && [ -d "$guard_base/home/.claude" ] || exit 0
        python3 -I - "$claude_bin" "$guard_base/home/.claude/plugins" "$guard_cfg" <<'PY'
        import json
        import pathlib
        import subprocess
        import sys

        claude_bin = sys.argv[1]
        plugins_dir = pathlib.Path(sys.argv[2])
        guard_cfg = pathlib.Path(sys.argv[3])

        def read_json(path):
            if not path.is_file():
                return {}
            data = json.loads(path.read_text(encoding="utf-8"))
            return data if isinstance(data, dict) else {}

        if not str(read_json(guard_cfg).get("proxy_url") or "").strip():
            sys.exit(0)

        installed = read_json(plugins_dir / "installed_plugins.json").get("plugins")
        records = installed.get("chisle@chisle") if isinstance(installed, dict) else None
        if isinstance(records, list) and any(isinstance(r, dict) and r.get("scope") == "user" for r in records):
            sys.exit(0)
        marketplaces = read_json(plugins_dir / "known_marketplaces.json")
        if "chisle" not in marketplaces:
            subprocess.run([claude_bin, "plugin", "marketplace", "add", "JayPokale/Chisle"], check=True)
        subprocess.run([claude_bin, "plugin", "install", "chisle@chisle"], check=True)
        PY
      description: Плагин Chisle для Claude Code
      stdout: true
      stderr: true
