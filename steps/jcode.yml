- link:
    ~/.config/jcode/launch:
      path: config/jcode/launch
      create: true
      force: false

- shell:
    - command: |
        set -eu
        has_ponytail=0
        for name in ponytail ponytail-audit ponytail-debt ponytail-gain ponytail-help ponytail-review; do
          if [ -e "$HOME/.agents/skills/$name" ] || [ -L "$HOME/.agents/skills/$name" ]; then
            has_ponytail=1
            break
          fi
        done
        if [ "$has_ponytail" -eq 1 ]; then
          DISABLE_TELEMETRY=1 npx --yes skills@1.7.4 remove ponytail ponytail-audit ponytail-debt ponytail-gain ponytail-help ponytail-review --global --yes
          for name in ponytail ponytail-audit ponytail-debt ponytail-gain ponytail-help ponytail-review; do
            rm -rf -- "$HOME/.agents/skills/$name"
          done
        fi
        DISABLE_TELEMETRY=1 npx --yes skills@1.7.4 add https://github.com/JayPokale/Chisle/tree/v3.14.2 --global --agent universal --skill '*' --yes
      description: Навыки Chisle для Jcode
      stdout: true
      stderr: true
    - command: DISABLE_TELEMETRY=1 npx --yes skills@1.7.4 add https://github.com/heydamir/unslop/tree/a6f121eee5f29c2f74976b75456feae8b66afb3a --global --agent universal --skill unslop --yes
      description: Навык Unslop для Jcode
      stdout: true
      stderr: true
    - command: |
        set -eu
        umask 077
        python3 -I - <<'PY'
        import os
        import pathlib
        import tempfile

        config_dir = pathlib.Path(os.environ.get("JCODE_HOME") or (pathlib.Path.home() / ".jcode"))
        config_dir.mkdir(parents=True, exist_ok=True)
        overlay = config_dir / "prompt-overlay.md"
        old = (
            'At the start of every new Jcode session, before responding or starting task work, '
            'load the installed `ponytail` skill with `skill_manage` (`action: "load", name: "ponytail"`). '
            'Apply `full` mode unless the user chooses another level or disables Ponytail. '
            'This also applies to swarm workers.'
        )
        new = (
            'At the start of every new Jcode session, before responding or starting task work, '
            'load the installed `chisle` skill with `skill_manage` (`action: "load", name: "chisle"`). '
            'Keep it active unless the user disables Chisle. '
            'This also applies to swarm workers.'
        )
        lines = overlay.read_text(encoding="utf-8").splitlines() if overlay.exists() else []
        if new in lines:
            updated = [line for line in lines if line != old]
        elif old in lines:
            updated = [new if line == old else line for line in lines]
        else:
            updated = lines + ([""] if lines and lines[-1] != "" else []) + [new]
        content = "\n".join(updated) + "\n"
        if not overlay.exists() or overlay.read_text(encoding="utf-8") != content:
            fd, tmp_name = tempfile.mkstemp(prefix=".prompt-overlay-", dir=config_dir)
            tmp = pathlib.Path(tmp_name)
            try:
                with os.fdopen(fd, "w", encoding="utf-8") as stream:
                    stream.write(content)
                tmp.chmod(0o600)
                tmp.replace(overlay)
            finally:
                tmp.unlink(missing_ok=True)
        PY
      description: Chisle в каждой сессии Jcode
      stdout: true
      stderr: true
    - command: scripts/jcode-install.sh
      description: Jcode (только Codex) и локальный Neo4j
      stdout: true
      stderr: true
