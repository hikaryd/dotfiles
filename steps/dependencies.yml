- shell:
    - command: scripts/brew-install.sh
      description: Пакеты Homebrew из Brewfile
      stdout: true
      stderr: true
    - command: |
        # homebrew-zathura не находит плагины сам (zegervdv/homebrew-zathura#19).
        # Ссылка живёт в Cellar, после brew upgrade zathura шаг нужно повторить.
        if ! command -v brew >/dev/null 2>&1 || ! brew list zathura-pdf-poppler >/dev/null 2>&1; then
          echo "zathura-pdf-poppler не установлен, пропуск"
          exit 0
        fi
        mkdir -p "$(brew --prefix zathura)/lib/zathura"
        ln -sf "$(brew --prefix zathura-pdf-poppler)/libpdf-poppler.dylib" \
          "$(brew --prefix zathura)/lib/zathura/libpdf-poppler.dylib"
        echo "плагин PDF для zathura подключён"
      description: Плагин PDF для zathura
      stdout: true
      stderr: true
    - command: |
        if ! command -v rustup >/dev/null 2>&1; then
          echo "Установка Rust nightly..."
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly --profile default
          echo "Rust установлен"
        else
          echo "rustup уже есть, включаю nightly"
          rustup default nightly
        fi
      description: Rust nightly
      stdout: true
      stderr: true
    - command: |
        if ! command -v cargo >/dev/null 2>&1 && [[ -f "$HOME/.cargo/env" ]]; then
          source "$HOME/.cargo/env"
        fi
        if ! command -v cargo >/dev/null 2>&1; then
          echo "cargo недоступен после установки Rust, xtop не поставить" >&2
          exit 1
        fi
        cargo install --git https://github.com/xtop-cli/xtop --all-features
      description: xtop из Git
      stdout: true
      stderr: true
