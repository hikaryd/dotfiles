- shell:
    - command: |
        if command -v malt >/dev/null 2>&1; then
          echo "malt already installed: $(malt --version 2>/dev/null || echo present)"
          exit 0
        fi
        echo "Installing malt (https://github.com/indaco/malt)..."
        curl -fsSL https://raw.githubusercontent.com/indaco/malt/main/scripts/install.sh | bash
        if command -v malt >/dev/null 2>&1; then
          eval "$(malt shellenv)" || true
          echo "malt installed."
        else
          echo "malt installation failed; subsequent malt steps will be skipped."
        fi
      description: Install malt (fast Homebrew alternative)
      stdout: true
      stderr: true
    - command: |
        if ! command -v malt >/dev/null 2>&1; then
          echo "malt not available. Skipping Maltfile."
          exit 0
        fi
        echo "Installing non-cask packages from Maltfile via malt ..."
        malt bundle install Maltfile
      description: Install formulas/taps via malt (Maltfile)
      stdout: true
      stderr: true
    - command: |
        if ! command -v brew >/dev/null 2>&1; then
          echo "Homebrew is not installed. Skipping Brewfile (casks)."
          exit 0
        fi
        echo "Installing casks from Brewfile via brew ..."
        brew bundle --file Brewfile
      description: Install casks via brew (Brewfile)
      stdout: true
      stderr: true
    - command: |
        if ! command -v brew >/dev/null 2>&1; then
          echo "Homebrew is not installed. Skipping Raycast."
          exit 0
        fi
        if brew list --cask raycast >/dev/null 2>&1 || [[ -d /Applications/Raycast.app ]]; then
          echo "Raycast already installed"
          exit 0
        fi
        echo "Installing Raycast (optional cask) ..."
        if ! brew install --cask raycast; then
          echo "Raycast cask download failed; skipping optional Raycast install."
        fi
      description: Install Raycast (optional)
      stdout: true
      stderr: true
    - command: |
        if ! command -v rustup >/dev/null 2>&1; then
          echo "Installing Rust with nightly toolchain..."
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly --profile default
          echo "Rust installed successfully."
        else
          echo "Rustup already installed. Ensuring nightly toolchain is set..."
          rustup default nightly
        fi
      description: Install Rust with nightly toolchain
      stdout: true
      stderr: true
    - command: |
        if python3 -c "import yaml" 2>/dev/null; then
          echo "PyYAML already installed"
        else
          pip3 install pyyaml --break-system-packages
        fi
      description: Install PyYAML for Python
      stdout: true
      stderr: true
    - command: |
        if command -v rtk >/dev/null 2>&1; then
          echo "rtk already installed"
        else
          echo "Installing rtk..."
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh
          rtk init --global
        fi
      description: Install rtk (Rust Token Killer)
      stdout: true
      stderr: true
