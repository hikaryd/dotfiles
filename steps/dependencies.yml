- shell:
    - command: scripts/brew-install.sh
      description: Install Homebrew packages via Brewfile
      stdout: true
      stderr: true
    - command: |
        # zathura из homebrew-zathura не видит плагины автоматически — dylib нужно
        # линковать вручную (https://github.com/zegervdv/homebrew-zathura/issues/19).
        # Симлинк живёт внутри Cellar-версии, поэтому после brew upgrade zathura
        # этот шаг нужно прогонять заново.
        if ! command -v brew >/dev/null 2>&1 || ! brew list zathura-pdf-poppler >/dev/null 2>&1; then
          echo "zathura-pdf-poppler is not installed. Skipping plugin link."
          exit 0
        fi
        mkdir -p "$(brew --prefix zathura)/lib/zathura"
        ln -sf "$(brew --prefix zathura-pdf-poppler)/libpdf-poppler.dylib" \
          "$(brew --prefix zathura)/lib/zathura/libpdf-poppler.dylib"
        echo "zathura PDF plugin linked"
      description: Link zathura PDF plugin (homebrew-zathura quirk)
      stdout: true
      stderr: true
    - command: |
        if ! command -v rustup >/dev/null 2>&1; then
          echo "Installing Rust with nightly toolchain..."
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly --profile default
          echo "Rust installed successfully."
        else
          echo "Rustup already installed. Ensuring nightly toolchain is set..."
          rustup default nightly
        fi
      description: Install Rust with nightly toolchain
      stdout: true
      stderr: true
    - command: |
        if ! command -v cargo >/dev/null 2>&1 && [[ -f "$HOME/.cargo/env" ]]; then
          source "$HOME/.cargo/env"
        fi
        if ! command -v cargo >/dev/null 2>&1; then
          echo "Cargo is not available after Rust setup; cannot install xtop." >&2
          exit 1
        fi
        cargo install --git https://github.com/xtop-cli/xtop --all-features
      description: Install xtop from Git with all features
      stdout: true
      stderr: true
