- shell:
    - command: |
        if ! command -v brew >/dev/null 2>&1; then
          echo "Homebrew is not installed. Skipping Brewfile."
          exit 0
        fi
        # Reconcile the `mos` cask before bundle: Homebrew chokes both when an
        # unmanaged Mos.app exists with a different version (adoption conflict)
        # and when it records mos but the .app is gone (stale state → upgrade
        # fails with "App source is not there"). Handle both directions.
        if grep -q '^cask "mos"' Brewfile; then
          INSTALLED_MOS_VERSION=""
          if brew list --cask mos >/dev/null 2>&1; then
            INSTALLED_MOS_VERSION="$(brew list --cask --versions mos 2>/dev/null | awk '{print $2}')"
          fi

          if [[ -n "$INSTALLED_MOS_VERSION" && ! -d /Applications/Mos.app ]]; then
            echo "Homebrew records Mos $INSTALLED_MOS_VERSION but /Applications/Mos.app is missing; clearing stale state..."
            brew uninstall --cask mos --force >/dev/null 2>&1 || true
          elif [[ -z "$INSTALLED_MOS_VERSION" && -d /Applications/Mos.app ]]; then
            EXISTING_MOS_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/Mos.app/Contents/Info.plist 2>/dev/null || true)"
            BACKUP_APP="/Applications/Mos.app.backup-${EXISTING_MOS_VERSION:-unknown}-$(date +%Y%m%d%H%M%S)"
            echo "Found unmanaged Mos.app ${EXISTING_MOS_VERSION:-?}; moving it to $BACKUP_APP before brew bundle..."
            mv /Applications/Mos.app "$BACKUP_APP"
          fi
        fi

        echo "Installing packages from Brewfile ..."
        brew bundle --file Brewfile
      description: Install Homebrew packages via Brewfile
      stdout: true
      stderr: true
    - command: |
        if ! command -v brew >/dev/null 2>&1; then
          echo "Homebrew is not installed. Skipping Raycast."
          exit 0
        fi
        if brew list --cask raycast >/dev/null 2>&1 || [[ -d /Applications/Raycast.app ]]; then
          echo "Raycast already installed"
          exit 0
        fi
        echo "Installing Raycast (optional cask) ..."
        if ! brew install --cask raycast; then
          echo "Raycast cask download failed; skipping optional Raycast install."
        fi
      description: Install Raycast (optional)
      stdout: true
      stderr: true
    - command: |
        if ! command -v rustup >/dev/null 2>&1; then
          echo "Installing Rust with nightly toolchain..."
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly --profile default
          echo "Rust installed successfully."
        else
          echo "Rustup already installed. Ensuring nightly toolchain is set..."
          rustup default nightly
        fi
      description: Install Rust with nightly toolchain
      stdout: true
      stderr: true
    - command: |
        if python3 -c "import yaml" 2>/dev/null; then
          echo "PyYAML already installed"
        else
          pip3 install pyyaml --break-system-packages
        fi
      description: Install PyYAML for Python
      stdout: true
      stderr: true
    - command: |
        if command -v rtk >/dev/null 2>&1; then
          echo "rtk already installed"
        else
          echo "Installing rtk..."
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh
          rtk init --global
        fi
      description: Install rtk (Rust Token Killer)
      stdout: true
      stderr: true
