- link:
    # Zsh
    ~/.zshrc:
      path: config/zsh/.zshrc
      create: true
      force: true
    ~/.zshenv:
      path: config/zsh/.zshenv
      create: true
      force: true
    ~/.zprofile:
      path: config/zsh/.zprofile
      create: true
      force: true
    ~/.config/zsh/functions:
      path: config/zsh/functions
      create: true
      force: true
    # Bash
    ~/.bashrc:
      path: config/bash/.bashrc
      create: true
      force: true
    ~/.bash_profile:
      path: config/bash/.bash_profile
      create: true
      force: true
    ~/.profile:
      path: config/bash/.profile
      create: true
      force: true
    # Shared shell — Codex (omx) VLESS-прокси (общий для bash и zsh)
    ~/.config/shell/codex-proxy.sh:
      path: config/shell/codex-proxy.sh
      create: true
      force: true
    # Codex proxy helper script (секреты в ~/.config/xray-codex/ не коммитятся)
    ~/.config/xray-codex/codex-proxy.py:
      path: config/xray-codex/codex-proxy.py
      create: true
      force: true
    # Alacritty
    ~/.config/alacritty/alacritty.toml:
      path: config/alacritty/alacritty.toml
      create: true
      force: true
    # Tmux
    ~/.config/tmux/tmux.conf:
      path: config/tmux/tmux.conf
      create: true
      force: true
    # Git
    ~/.gitconfig:
      path: config/git/.gitconfig
      create: true
      force: true
    ~/.gitignore_global:
      path: config/git/.gitignore_global
      create: true
      force: true
    ~/.config/git/gitk:
      path: config/git/gitk
      create: true
      force: true
    ~/.config/git/hooks/prepare-commit-msg:
      path: config/git/hooks/prepare-commit-msg
      create: true
      force: true
    # SSH
    ~/.ssh/config:
      path: config/ssh/config
      create: true
      force: true
    # Starship
    ~/.config/starship.toml:
      path: config/starship/starship.toml
      create: true
      force: true
    # Fastfetch
    ~/.config/fastfetch/config.jsonc:
      path: config/fastfetch/config.jsonc
      create: true
      force: true
    # Nushell
    ~/.config/nushell/config.nu:
      path: config/nushell/config.nu
      create: true
      force: true
    ~/.config/nushell/ayu.nu:
      path: config/nushell/ayu.nu
      create: true
      force: true
    # Sesh
    ~/.config/sesh/sesh.toml:
      path: config/sesh/sesh.toml
      create: true
      force: true
    # WezTerm
    ~/.config/wezterm/wezterm.lua:
      path: config/wezterm/wezterm.lua
      create: true
      force: true
- shell:
    - command: |
        mkdir -p "$HOME/.local/bin"
        cd "$HOME/dots/tools/kube-rollout"
        go build -o "$HOME/.local/bin/kube-deploy-watch" .
        cd "$HOME/dots/tools/kube-log-watch"
        go build -o "$HOME/.local/bin/kube-log-watch" .
        cd "$HOME/dots/tools/kube-pod-analyze"
        go build -o "$HOME/.local/bin/kube-pod-analyze" .
      description: Building read-only Kubernetes watchers
      stdout: true
      stderr: true
    - command: chmod +x ~/.config/git/hooks/prepare-commit-msg
      description: Making git hook executable
      stdout: false
      stderr: false
    - command: git config --global core.excludesFile '~/dots/config/git/.gitignore_global'
      description: Setting global git excludesFile
      stdout: true
      stderr: true
    - command: |
        if [[ ! -d "$HOME/.tmux/plugins/tpm" ]]; then
          echo "Installing TPM (tmux plugin manager)..."
          mkdir -p "$HOME/.tmux/plugins"
          git clone https://github.com/tmux-plugins/tpm "$HOME/.tmux/plugins/tpm"
        else
          echo "TPM already present; updating..."
          git -C "$HOME/.tmux/plugins/tpm" pull --ff-only || true
        fi
      description: Installing tmux plugin manager (TPM)
      stdout: true
      stderr: true
    - command: |
        if ! grep -q "/opt/homebrew/bin/zsh" /etc/shells 2>/dev/null; then
          echo "Adding Homebrew zsh to /etc/shells..."
          sudo sh -c 'echo "/opt/homebrew/bin/zsh" >> /etc/shells'
        else
          echo "Homebrew zsh already in /etc/shells"
        fi
      description: Adding Homebrew zsh to available shells
      stdout: true
      stderr: true
    - command: |
        if [[ "$(dscl . -read /Users/$USER UserShell | awk '{print $2}')" != "/opt/homebrew/bin/zsh" ]]; then
          echo "Setting zsh as default shell..."
          chsh -s /opt/homebrew/bin/zsh
        else
          echo "Zsh is already the default shell"
        fi
      description: Setting zsh as default login shell
      stdout: true
      stderr: true
