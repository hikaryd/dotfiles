- link:
    # Ghostty terminal
    ~/.config/ghostty/config:
      path: config/ghostty/config
      create: true
      force: true
    # Attyx terminal
    ~/.config/attyx/attyx.toml:
      path: config/attyx/attyx.toml
      create: true
      force: true
    # Yazi file manager
    ~/.config/yazi/yazi.toml:
      path: config/yazi/yazi.toml
      create: true
      force: true
    ~/.config/yazi/init.lua:
      path: config/yazi/init.lua
      create: true
      force: true
    # Lazygit
    ~/.config/lazygit/config.yml:
      path: config/lazygit/config.yml
      create: true
      force: true
    # Bat
    ~/.config/bat/config:
      path: config/bat/config
      create: true
      force: true
    # Thorium browser theme
    ~/.config/thorium/ayu-dark:
      path: config/thorium/ayu-dark
      create: true
      force: true
- shell:
    - command: |
        # Install Firefox and CascadeFox/Cascade userChrome theme
        FIREFOX_APP="/Applications/Firefox.app/Contents/MacOS/firefox"
        FIREFOX_BASE="$HOME/Library/Application Support/Firefox"
        FIREFOX_PROFILES="$FIREFOX_BASE/Profiles"
        CASCADE_DIR="$HOME/.cache/cascadefox/cascade"
        CASCADE_REPO="https://github.com/cascadefox/cascade.git"

        if [[ ! -x "$FIREFOX_APP" ]]; then
          echo "Firefox.app not found, skipping Cascade install."
          exit 0
        fi

        mkdir -p "$FIREFOX_PROFILES" "$(dirname "$CASCADE_DIR")"

        if [[ ! -d "$CASCADE_DIR/.git" ]]; then
          echo "Cloning Cascade theme..."
          rm -rf "$CASCADE_DIR"
          git clone --depth 1 "$CASCADE_REPO" "$CASCADE_DIR"
        else
          echo "Updating Cascade theme..."
          git -C "$CASCADE_DIR" pull --ff-only || true
        fi

        if [[ ! -d "$CASCADE_DIR/chrome" ]]; then
          echo "Cascade chrome directory not found, skipping."
          exit 0
        fi

        shopt -s nullglob
        profiles=("$FIREFOX_PROFILES"/*/)
        if [[ ${#profiles[@]} -eq 0 ]]; then
          echo "Creating Firefox default profile..."
          "$FIREFOX_APP" -CreateProfile "default-release $FIREFOX_PROFILES/default-release" >/dev/null 2>&1 || true
          profiles=("$FIREFOX_PROFILES"/*/)
        fi

        INSTALLED=0
        for profile_dir in "${profiles[@]}"; do
          profile_name="$(basename "$profile_dir")"
          case "$profile_name" in
            *default*|*release*|*.default|*.default-release|default-release) ;;
            *)
              if [[ ! -f "$profile_dir/prefs.js" ]]; then
                continue
              fi
              ;;
          esac

          echo "Firefox profile: $profile_name"
          mkdir -p "$profile_dir/chrome"
          rsync -a --delete "$CASCADE_DIR/chrome/" "$profile_dir/chrome/"
          cp "$HOME/dots/config/firefox/user.js" "$profile_dir/user.js"
          echo "  Installed Cascade chrome + Firefox user.js"
          INSTALLED=1
        done

        if [[ "$INSTALLED" -eq 0 ]]; then
          echo "No Firefox profiles found, skipping Cascade install."
        fi
      description: Install Firefox Cascade theme
      stdout: true
      stderr: true
    - command: |
        # Install Zen Browser user-overrides.js and userChrome.css
        ZEN_BASE="$HOME/Library/Application Support/zen"
        if [[ ! -d "$ZEN_BASE/Profiles" ]]; then
          echo "Zen Browser not found, skipping."
          exit 0
        fi
        INSTALLED=0
        for profile_dir in "$ZEN_BASE/Profiles/"*/; do
          # Only install into profiles that have been used (have prefs.js)
          if [[ -f "$profile_dir/prefs.js" ]]; then
            echo "Zen profile: $(basename "$profile_dir")"
            cp "$HOME/dots/config/zen-browser/user-overrides.js" "$profile_dir/user.js"
            mkdir -p "$profile_dir/chrome"
            cp "$HOME/dots/config/zen-browser/userChrome.css" "$profile_dir/chrome/userChrome.css"
            echo "  Installed user.js + userChrome.css"
            INSTALLED=1
          fi
        done
        if [[ "$INSTALLED" -eq 0 ]]; then
          echo "No active Zen profiles found, skipping."
        fi
      description: Install Zen Browser settings
      stdout: true
      stderr: true
    - command: |
        # Apply AyuGram theme — copy to tdata for auto-load
        AYUGRAM_DIR="$HOME/Library/Application Support/AyuGram Desktop/tdata"
        if [[ -d "$AYUGRAM_DIR" ]]; then
          cp "$HOME/dots/config/ayugram/ayu-dark.tdesktop-theme" "$AYUGRAM_DIR/" 2>/dev/null
          echo "AyuGram theme copied. Open the file in AyuGram to apply."
        else
          echo "AyuGram not found, skipping theme install"
        fi
      description: Copy AyuGram theme to tdata
      stdout: true
      stderr: true
    - command: |
        # Install yazi plugins if not already installed
        if [[ ! -d ~/.config/yazi/plugins ]]; then
          echo "Installing yazi plugins..."
          git clone --depth 1 https://github.com/yazi-rs/plugins ~/.config/yazi/plugins
        fi
      description: Installing yazi plugins
      stdout: true
      stderr: true
